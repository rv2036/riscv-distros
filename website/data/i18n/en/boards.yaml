# RISC-V board entries
items:
- id: qemu
  name: QEMU virt (virtual machine)
  soc: None (generic QEMU virtual platform, RV32/RV64 configurable, up to 512 cores)
  vendor: QEMU Project
  spec: 'Pure virtual platform: up to 512 RV64GC cores, CLINT/PLIC, a PCIe host bridge, 8 virtio-mmio devices, NS16550 UART, optional AIA/IOMMU; memory, disks and networking are all virtualised through
    command-line options, with no real GPU/VPU/NPU.'
  status: virtual
  price_note: Free and open source (GPLv2), available from every distro's package repos
  forms: []
  official_os:
  - debian
  - ubuntu
  distros:
  - distro: debian
    level: official
    note: riscv64 is a first-class architecture since Debian 13; the official netinst ISO installs straight into virt
  - distro: ubuntu
    level: official
    note: Official riscv64 cloud image, booted with EDK2 (pflash) or -kernel
  - distro: fedora
    level: community
    note: Fedora RISC-V provides QEMU install docs and images
  - distro: alpine
    level: official
    note: riscv64 minirootfs only, no virt ISO; bring your own kernel/initramfs
  - distro: arch
    level: official
    note: archriscv provides a riscv64 ISO that boots in QEMU
  - distro: opensuse
    level: community
    note: openSUSE Ports has riscv64; the site returns 403 to curl, so the direct link is unverified
  - distro: gentoo
    level: official
    note: riscv64 stage3 plus handbook coverage for QEMU systems
  - distro: void
    level: partial
    note: The riscv64 port exists; you build the QEMU image yourself
  - distro: nixos
    level: community
    note: riscv64 is not an official support tier; cross-build required
  - distro: alt
    level: official
    note: ALT Ports riscv64 provides a QEMU image
  - distro: freebsd
    level: official
    note: riscv64 supports QEMU virt
  - distro: netbsd
    level: official
    note: The riscv64 port supports QEMU
  - distro: openbsd
    level: official
    note: riscv64 supports QEMU virt
  - distro: openeuler
    level: official
    note: The openEuler RISC-V SIG provides a QEMU image
  - distro: buildroot
    level: official
    note: qemu_riscv64_virt_defconfig — one make and the system boots
  - distro: yocto
    level: official
    note: qemuriscv64 machine officially supported
  downloads:
  - label: 'QEMU docs: the RISC-V virt machine'
    url: https://www.qemu.org/docs/master/system/riscv/virt.html
  - label: QEMU download page
    url: https://www.qemu.org/download/
  - label: Ubuntu 24.04 riscv64 cloud image
    url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-riscv64.img
  - label: Debian 13.7 riscv64 netinst ISO
    url: https://cdimage.debian.org/debian-cd/current/riscv64/iso-cd/
  - label: Arch Linux RISC-V ISO
    url: https://archriscv.felixc.at/images/archlinux-2026.08.27-riscv64.iso
  - label: Alpine riscv64 minirootfs
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - label: Buildroot downloads
    url: https://buildroot.org/downloads/
  guides:
  - label: 'QEMU wiki: RISC-V platform notes'
    url: https://wiki.qemu.org/Documentation/Platforms/RISCV
    type: doc
    lang: en
  - label: 'Debian wiki: RISC-V port'
    url: https://wiki.debian.org/RISC-V
    type: doc
    lang: en
  - label: 'Fedora: RISC-V installation guide'
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Gentoo RISC-V project
    url: https://wiki.gentoo.org/wiki/Project:RISC-V
    type: doc
    lang: en
  - label: openEuler RISC-V SIG
    url: https://www.openeuler.org/en/sig/sig-RISC-V
    type: doc
    lang: en
  gotchas:
  - -bios default only loads OpenSBI, with no U-Boot/EDK2; booting an Ubuntu/Fedora cloud image needs pflash with a 32MiB EDK2 firmware, otherwise you get a black screen
  - virt has no GPU/VPU/NPU — don't use it to validate graphics, hardware video decoding or AI acceleration
  - The serial port is always ttyS0; to quit -nographic mode press Ctrl-A then X
  - From Ubuntu 26.04 RVA23S64 is required, so older QEMU builds without the extensions won't boot; 24.04 is still RVA20
  - Alpine riscv64 ships only a minirootfs with no virt ISO, so prepare the kernel and initramfs yourself
  doc_langs:
  - en
  note: 'The common starting point for every board: validate the kernel/rootfs on virt first, then move to real hardware — it saves a lot of flashing and debugging time.'
  checked: '2026-11-01'
  order: 1
  feature: true
