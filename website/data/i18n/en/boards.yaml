    url: https://deepin-community.github.io/sig-deepin-ports/images/riscv64
  guides:
  - label: Meles overview and specs (English)
    url: https://milkv.io/docs/meles/overview
    type: doc
    lang: en
  - label: Meles hardware notes (versions/power/interfaces)
    url: https://milkv.io/docs/meles/hardware/meles-main-board
    type: doc
    lang: en
  - label: Meles overview and specs (Chinese)
    url: https://milkv.io/zh/docs/meles/overview
    type: doc
    lang: zh
  - label: Meles installation notes (Chinese)
    url: https://milkv.io/zh/docs/meles/installation
    type: doc
