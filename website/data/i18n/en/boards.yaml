    url: https://github.com/starfive-tech/VisionFive2
    type: doc
    lang: en
  - label: Debian wiki install guide
    url: https://wiki.debian.org/InstallingDebianOn/StarFive/VisionFiveV2
    type: doc
    lang: en
  - label: 'Gentoo wiki: StarFive VisionFive 2'
    url: https://wiki.gentoo.org/wiki/StarFive_VisionFive_2
    type: doc
    lang: en
  - label: RVspace community (Chinese and English)
    url: https://rvspace.org/
    type: doc
    lang: zh
  - label: Fedora RISC-V installation guide
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  gotchas:
  - 'U-Boot/SPL lives in QSPI flash and images are tightly bound to firmware: images after 202310 need U-Boot >= v3.1.5 in QSPI, otherwise flash u-boot-spl.bin.normal.out + visionfive2_fw_payload.img first'
  - Boot order is QSPI → SD/eMMC/NVMe; a wrong DIP switch boots from the wrong medium
  - There are failure reports for Debian 202510 on older v1.2 boards; upgrade the firmware first or use mainline Debian
  - StarFive's official Debian 202510 can't boot from USB; mainline Debian 13 can, but without HDMI/GPU/VPU drivers
  - VisionFive 2 Lite uses different U-Boot/DTB from the standard board — images are not interchangeable
  - eMMC/SD boot has known errata; prefer NVMe or a good SD card
  doc_langs:
  - en
  - zh
  note: The JH7110 board with the widest ecosystem and distro coverage, and one of the best first RISC-V boards; watch for firmware differences between batches. Community derivatives such as openwrt/dietpi/guix
    exist too (not listed as standard distro ids).
  checked: '2026-11-01'
  order: 2
  feature: true
