    state: unknown
    evidence:
    - https://github.com/ggml-org/llama.cpp
    - https://github.com/ggml-org/llama.cpp/issues/20988
    note: No public Unmatched-specific benchmark found; upstream only ships source (no riscv64 binaries in releases), and U74 has no RVV, so it is scalar-only and expected to be slow.
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    - https://github.com/microsoft/onnxruntime
    note: Upstream includes an MLAS RVV kernel and tools/scripts/build_riscv64.sh (contributed by SiFive), but there are no riscv64 prebuilt packages, so cross-compile yourself; the RVV kernel targets RVV 1.0.
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
