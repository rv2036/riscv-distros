- board: licheepi-4a
  board_name: LicheePi 4A
  soc: T-HEAD TH1520 (4x C910 @1.85GHz, RV64GCV 0.7.1)
  runs:
  - item: llama.cpp
    state: works
    evidence:
    - https://raw.githubusercontent.com/sipeed/sipeed_wiki/main/docs/hardware/en/lichee/th1520/lpi4a/8_application.md
    - https://github.com/ggml-org/llama.cpp
    note: 'Sipeed''s official wiki has a llama.cpp section: about 6s/token for a 7B model (without the V extension). C910 is RVV 0.7.1, so upstream''s RVV 1.0 optimisation path does not apply and it stays scalar.'
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: Upstream's riscv64 MLAS RVV kernel targets RVV 1.0; the TH1520's 0.7.1 vectors can't use it, so it falls back to scalar.
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: RISE wheels need glibc >= 2.39 and are optimised for RVV 1.0; they install on RevyOS/Debian but give no vector acceleration.
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: Works as usual; the RVV HAL has limited 0.7.1 support.
  - item: ncnn
    state: partial
    evidence:
    - https://github.com/Tencent/ncnn
    note: Builds, but the RVV optimisations target 1.0 and degrade to scalar on 0.7.1.
  - item: tengine
    state: partial
    evidence:
    - https://github.com/OAID/Tengine/tree/tengine-lite/source/device/cpu/op/conv/risc-v
    note: tengine-lite ships an rv64-c906 toolchain and RVV convolution kernels built for 0.7.1 cores like the C906/C910, but only some operators are covered.
  - item: npu-sdk (HHB)
    state: partial
    evidence:
    - https://raw.githubusercontent.com/sipeed/sipeed_wiki/main/docs/hardware/en/lichee/th1520/lpi4a/8_application.md
    note: 'The official wiki documents the NPU flow: the T-Head HHB compiler turns ONNX into NPU executables (int8/int16 fixed point) inside a dedicated Docker image; the toolchain is closed source and fixed-point only, so it is unsuitable for LLMs.'
  npu: 4 TOPS@INT8, vendor closed-source HHB toolchain only (int8/int16 fixed point), no upstream open-source driver
  note: Running an LLM on the CPU works but is slow (~6s/token); the NPU only has the closed T-Head HHB path and cannot run Transformer LLMs.
  checked: '2026-11-01'
  order: 4
