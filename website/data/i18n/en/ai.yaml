    note: PyPI has no riscv64 wheels; RISE provides a torch 2.13.0 manylinux_2_39_riscv64 wheel (needs glibc >= 2.39, e.g. Ubuntu 24.04/Bianbu).
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: Upstream 4.x supports RISC-V and the RVV HAL; most distros can install it or build it with the RVV backend. No per-board performance validation.
  - item: ncnn
    state: partial
    evidence:
    - https://github.com/Tencent/ncnn
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: Upstream has linux-riscv64 CI and RVV implementations; U74 has no RVV, so ncnn runs scalar-only.
  - item: tengine
    state: partial
    evidence:
    - https://raw.githubusercontent.com/OAID/Tengine/tengine-lite/README_EN.md
    - https://github.com/OAID/Tengine/tree/tengine-lite/source/device/cpu/op/conv/risc-v
    note: tengine-lite provides RVV convolution kernels for risc-v/lp64dv and an rv64-c906 toolchain; only some operators are optimised, so support is experimental.
  npu: No NPU
  note: ruyi provides OpenBSD/Ubuntu/openKylin/openWrt images; a long-standing ecosystem, but with no AI accelerator.
