# Generated from website/data/i18n/zh/ai.yaml; keep structure identical.
ruyisdk:
  url: https://matrix.ruyisdk.org/
  fetched_at: '2026-11-01'
  note: RuyiSDK's official "RISC-V Board and OS Support Matrix". The front end is a static Astro site whose /table/ content is rendered by JS, and the data comes straight from the GitHub repo ruyisdk/support-matrix (one README.md per board/distro directory, with YAML frontmatter as the data source). This snapshot was parsed from all 951 markdown files pulled with a git sparse clone, which is equivalent to the site data. The matrix records support level — whether it boots and whether it reaches a desktop — not per-package availability; for "RuyiSDK can flash it directly" see ruyi_provisioning.
items:
- board: qemu
  board_name: QEMU virt (virtual machine)
  soc: QEMU-emulated rv64 (vlen=256, RVV 1.0)
  runs:
  - item: llama.cpp
    state: works
    evidence:
    - https://github.com/kriznaw/llama.cpp-riscv64-qemu
    - https://raw.githubusercontent.com/ggml-org/llama.cpp/master/docs/build-riscv64-spacemit.md
    note: Upstream builds run with qemu-riscv64 -cpu max,vlen=256; SpacemiT's docs give the full command to run llama-cli in QEMU. Functional validation only — the speed means nothing.
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: build_riscv64.sh uses QEMU to validate cross-compiled artifacts; it runs, but very slowly.
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: The RISE wheels explicitly say they are not built for QEMU; under QEMU you can only check that things work.
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: Runs in emulation; performance figures are meaningless.
  - item: ncnn
    state: works
    evidence:
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: CI passes on riscv64.
  npu: None (emulation only)
  note: Only for validating compilation and functionality without hardware; it says nothing about performance.
  checked: '2026-11-01'
  order: 1
