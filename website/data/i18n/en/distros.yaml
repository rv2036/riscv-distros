- id: bianbu
  name: Bianbu
  vendor: ''
  upstream: downstream
  upstream_note: 'Downstream vendor distro: the official OS from SpacemiT, explicitly described as built from Ubuntu community sources, using APT and .deb packages; K1 follows Ubuntu 24.04 (2.x)/25.04 (3.x),
    K3 follows Ubuntu 26.04 (4.x).'
  kind: distro
  based_on: Ubuntu 24.04 LTS (Bianbu 2.x, K1) / Ubuntu 25.04 (Bianbu 3.x, K1) / Ubuntu 26.04 (Bianbu 4.x, K3; per vendor forum, not stated per release in official docs) + vendor BSP kernel 6.6 LTS / 6.18
  audience: recommended
  versions:
  - Bianbu 2.3.5 (K1, Ubuntu 24.04 base, built 2026-06 / uploaded 2026-08-27)
  - Bianbu 3.0.1 (K1, Ubuntu 25.04 base, 2025-08-15)
  - Bianbu 4.0.8 (K3, Ubuntu 26.04 base, 2026-10-22)
  boards:
  - board: bpi-f3
    level: official
    note: Banana Pi BPI-F3 (K1) is on the supported list; the same family also has Milk-V Jupiter and MUSE Card/Pi/Pi Pro/Box/Book
  - board: k3
    level: official
    note: 'K3 platforms: Pico-ITX and CoM260 Kit, Bianbu 4.x only'
  downloads:
  - label: K1 image index (official archive, every version and date)
