# en distro entries
items:
- id: debian
  name: Debian
  vendor: ''
  upstream: official
  upstream_note: 'riscv64 has been an official release architecture since Debian 13 (trixie) — the official announcement says: "This release for the first time officially supports the riscv64 architecture".
    It lives in the main archive on deb.debian.org, not the ports add-on tree (debian.org/ports lists riscv64 as 13/released).'
  kind: distro
  based_on: Independent
  audience: recommended
  versions:
  - 13.7 (trixie, current stable; ISO is debian-13.7.0-riscv64-netinst.iso)
  - 14 (forky, in development/testing)
  boards:
  - board: qemu
    level: official
    note: The official riscv64 netinst installs on QEMU virt; it is a primary target platform for d-i
  - board: unmatched
    level: community
    note: Generic riscv64 image booted via the board's own U-Boot/UEFI; Debian does not publish board images
  - board: visionfive2
    level: community
    note: 'As above: JH7110 boards use the vendor U-Boot to provide UEFI, then install the generic image'
  - board: licheepi-4a
    level: partial
    note: TH1520 needs a vendor U-Boot/kernel; Debian mainline has no board support
  - board: meles
    level: partial
    note: Same TH1520 platform, so the situation matches LicheePi 4A
  - board: k3
    level: partial
    note: SpacemiT K3 needs the vendor BSP; mainline Debian support is unconfirmed
  - board: a210
    level: partial
    note: Zhihe A210 needs vendor firmware/kernel; no official Debian support
  - board: k230
    level: partial
    note: Canaan K230 is an MCU-class SoC with limited mainline support
  - board: megrez
    level: community
    note: EIC7700 boards can use the generic UEFI image; not confirmed in Debian docs
  - board: titan
    level: community
    note: DP1000 as above; not confirmed in Debian docs
  - board: pioneer
    level: community
    note: SG2042 can use the generic image; not confirmed in Debian docs
  - board: orangepi-rv2
    level: community
    note: 'SpacemiT K1 board: generic image + board U-Boot'
  - board: bpi-f3
    level: community
    note: 'SpacemiT K1 board: generic image + board U-Boot'
  downloads:
  - label: riscv64 CD image directory (cdimage, current stable)
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - label: debian-13.7.0-riscv64-netinst.iso direct link
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  guides:
  - label: Debian GNU/Linux 13 riscv64 installation guide (English)
    url: https://www.debian.org/releases/stable/riscv64/
    type: doc
    lang: en
  - label: Installation guide, Simplified Chinese
    url: https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
    type: doc
    lang: zh
  - label: Installation guide, Japanese
    url: https://www.debian.org/releases/stable/riscv64/index.ja.html
    type: doc
    lang: ja
  - label: Installation guide, Korean
    url: https://www.debian.org/releases/stable/riscv64/index.ko.html
    type: doc
    lang: ko
  - label: Installation guide, Russian
    url: https://www.debian.org/releases/stable/riscv64/index.ru.html
    type: doc
    lang: ru
  - label: 'RISC-V Linux in 2026: Debian, RVA23, Servers, Hardware—and What''s Still Missing'
    url: https://www.youtube.com/watch?v=C5NkSlf4_WE
    type: video
    lang: en
  gotchas:
  - Only generic riscv64 images (netinst/ISO) are published, no board images; whether it boots depends on the board's U-Boot/UEFI firmware
  - 'The official guide says of itself: "This installation guide has not been fully updated and fact checked for riscv64" — some chapters may be stale'
  - A netinst install needs network access to fetch packages
  doc_langs:
  - en
  - zh
  - ja
  - ko
  - ru
  - fr
  - de
  derivatives:
  - Ubuntu
  note: Debian is the only independent distro here that made riscv64 an official release architecture; separately there are Debian-based riscv64 systems such as deepin and RevyOS (not verified one by one).
  checked: '2026-11-01'
  order: 1
  feature: true
  sources:
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  - https://www.debian.org/releases/stable/riscv64/
  - https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
  - https://www.debian.org/releases/stable/riscv64/index.ja.html
  - https://www.debian.org/releases/stable/riscv64/index.ko.html
  - https://www.debian.org/releases/stable/riscv64/index.ru.html
  - https://www.youtube.com/watch?v=C5NkSlf4_WE
  - https://matrix.ruyisdk.org/reports/K230/Debian/README/
  - https://matrix.ruyisdk.org/reports/Mars/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo256m/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo_S/Debian/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Debian/README/
  - https://matrix.ruyisdk.org/
- id: ubuntu
  name: Ubuntu
  vendor: ''
  upstream: official
  upstream_note: Canonical builds and hosts the riscv64 images itself ("built and hosted by Canonical"); riscv64 is an officially supported Ubuntu architecture. From 26.04 LTS the ISA baseline moves to
    RVA23S64.
  kind: distro
  based_on: Debian
  audience: recommended
  versions:
  - 26.10 (current, RVA23)
  - 26.04.1 LTS (RVA23)
  - 24.04.5 LTS (RVA20, older hardware still supported)
  boards:
  - board: qemu
    level: official
    note: 26.10 / 26.04.1 LTS provide Desktop and Server live installers plus preinstalled images; the official page has QEMU instructions
  - board: unmatched
    level: official
    note: 24.04.5 LTS provides ubuntu-24.04.5-preinstalled-server-riscv64+unmatched.img.xz
  - board: visionfive2
    level: official
    note: jh7110 image (24.04.5 LTS +jh7110, covering VisionFive 2 / VisionFive 2 Lite)
  - board: licheepi-4a
    level: partial
    note: LicheePi 4A is not in the official board list (only the Sipeed LicheeRV Dock is), so you need your own or a community image
  - board: meles
    level: partial
    note: Milk-V Meles is not in the official board list
  - board: k3
    level: official
    note: SpacemiT K3 platforms (CoM260, picoITX, DeepComputing FML13V05) supported since 26.10
  - board: a210
    level: partial
    note: Zhihe A210 is not in the official board list
  - board: k230
    level: partial
    note: Canaan K230 is not in the official board list
  - board: megrez
    level: partial
    note: Milk-V Megrez is not in the official board list
  - board: titan
    level: partial
    note: Milk-V Titan is not in the official board list
  - board: pioneer
    level: partial
    note: Milk-V Pioneer is not in the official board list
  - board: orangepi-rv2
    level: partial
    note: The official list only has Milk-V Mars (same K1), no Orange Pi RV2
  - board: bpi-f3
    level: partial
    note: Banana Pi BPI-F3 is not in the official board list
  downloads:
  - label: Canonical's official RISC-V download page (pick an image per board)
    url: https://ubuntu.com/download/risc-v/canonical-built
  - label: cdimage 26.10 riscv64 directory
    url: https://cdimage.ubuntu.com/releases/26.10/release/
  - label: cdimage 26.04.1 LTS riscv64 directory
    url: https://cdimage.ubuntu.com/releases/26.04/release/
  guides:
  - label: The RISC-V download page includes per-board installation instructions
    url: https://ubuntu.com/download/risc-v/canonical-built
    type: doc
    lang: en
  - label: Announcing Ubuntu desktop images for RISC-V (2026-10)
    url: https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
    type: doc
    lang: en
  gotchas:
  - '26.04 LTS requires RVA23S64: non-RVA23 hardware (VisionFive 2/JH7110, SiFive Unmatched, etc.) is limited to 24.04.5 LTS — "Hardware that is not RVA23-ready continues to be supported by our 24.04.5
    LTS release"'
  - Some board images are headless only (no GPU, no WiFi); the official page says so explicitly under the DeepComputing FML13V01 entry
  - Board images are distinguished by a +<board> suffix (+unmatched/+jh7110/+icicle/+nezha/+licheerv/+pic64gx); the wrong one won't boot
  doc_langs:
  - en
  derivatives:
  - Ubuntu Base (riscv64 rootfs)
  - DeepComputing FML13V01 partner-built Ubuntu
  note: 'Ubuntu has the most detailed board support: it publishes preinstalled images per board, but 26.04 raised the bar to RVA23, leaving older boards stuck on 24.04 LTS.'
  checked: '2026-11-01'
  order: 2
  feature: true
  sources:
  - https://ubuntu.com/download/risc-v/canonical-built
  - https://cdimage.ubuntu.com/releases/26.10/release/
  - https://cdimage.ubuntu.com/releases/26.04/release/
  - https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
  - https://matrix.ruyisdk.org/reports/K230/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Mars/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo256m/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo_S/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Ubuntu/README_LTS/
  - https://matrix.ruyisdk.org/
- id: fedora
  name: Fedora
  vendor: ''
  upstream: community
  upstream_note: 'The official Fedora wiki states: "riscv64 is currently not an officially supported Fedora architecture". Images are maintained by the Fedora RISC-V SIG under dl.fedoraproject.org/pub/alt/risc-v/
    (an alt tree, not a primary architecture) and do not take part in release blocking.'
  kind: distro
  based_on: Independent
  audience: recommended
  versions:
  - 44 (stable, RISC-V images available)
  - 45 (Beta/RC, RISC-V images labelled "non-official, community-contributed")
  - rawhide
  boards:
  - board: qemu
    level: official
    note: Officially supported with the mainline kernel (QEMU entry on the Hardware page)
  - board: unmatched
    level: partial
    note: SiFive Unmatched is not on the Hardware page (only Premier P550 is)
  - board: visionfive2
    level: official
    note: Officially supported under the StarFive JH7110 entry; use the mainline kernel if you don't need NVMe/PCIe
  - board: licheepi-4a
    level: partial
    note: LicheePi 4A / TH1520 are not on the Hardware page
  - board: meles
    level: partial
    note: Milk-V Meles is not on the Hardware page
  - board: k3
    level: official
    note: 'SpacemiT K3 entry: K3 Pico-ITX, Milk-V Jupiter 2, K3-CoM260, DC-ROMA III (FML13V05)'
  - board: a210
    level: partial
    note: Zhihe A210 is not on the Hardware page
  - board: k230
    level: partial
    note: Canaan K230 is not on the Hardware page
  - board: megrez
    level: official
    note: Officially supported under the ESWIN EIC7700X entry (Milk-V Megrez, HiFive Premier P550)
  - board: titan
    level: official
    note: Officially supported under the UltraRISC UR-DP1000 entry (Milk-V Titan)
  - board: pioneer
    level: official
    note: Officially supported under the SOPHGO SG2042 entry (Milk-V Pioneer)
  - board: orangepi-rv2
    level: official
    note: Officially supported under the SpacemiT M1/K1 entry (covers Orange Pi RV 2, BPI-F3, Milk-V Jupiter)
  - board: bpi-f3
    level: official
    note: Officially supported under the SpacemiT M1/K1 entry (Banana Pi BPI-F3)
  downloads:
  - label: Fedora RISC-V image root (alt/risc-v/releases)
    url: https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - label: Fedora Remix for RISC-V
    url: https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  guides:
  - label: Fedora RISC-V installation guide (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Fedora RISC-V supported hardware list (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
    type: doc
    lang: en
  - label: Fedora/RISC-V project home (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V
    type: doc
    lang: en
  gotchas:
  - Most boards need the Omni kernel (...riscv64.omni.fcXX); the standard 7.x kernel only covers the VisionFive 2 / Orange Pi RV / Milk-V Mars class — "Most boards can only boot when using the Omni kernel"
  - Some Omni kernel patches are not upstream yet ("Some patches in this kernel are still under review upstream")
  - 'Headless only: mainline has no integrated GPU driver, and the project positions this as a build machine/server ("video output are pretty much completely ignored")'
  - Installation requires a serial console (Requirements → Serial console access)
  - Some packages need RISC-V-specific patches and still differ from upstream sources
  doc_langs:
  - en
  derivatives:
  - Fedora-V Force (FVF)
  - Fedora Remix for RISC-V
  note: Fedora runs an official RISC-V SIG with continuous builds, but the project still labels riscv64 "not officially supported" and ships images through the alt channel. It works fine day to day; its
    support level is simply not the same as Debian or Ubuntu.
  checked: '2026-11-01'
  order: 3
  feature: true
  sources:
  - https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
  - https://fedoraproject.org/wiki/Architectures/RISC-V
  - https://matrix.ruyisdk.org/reports/Bit-Brick_K1/Fedora/README/
  - https://matrix.ruyisdk.org/reports/BPI-F3/Fedora/README/
  - https://matrix.ruyisdk.org/reports/K230/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheeCluster4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheePi4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/Mars/Fedora/README/
  - https://matrix.ruyisdk.org/
- id: fvf
  name: Fedora-V Force (FVF)
  vendor: ''
  upstream: downstream
  upstream_note: Fedora-V Force is an independent team/community project that compiles its own riscv64 builds from Fedora 36 through rawhide and adapts them to boards; its site says it is "independently
    compiling releases from Fedora 36 to rawhide", and it has no affiliation with Fedora's official release process.
  kind: distro
  based_on: Fedora
  audience: recommended
  versions:
  - Fedora 36 → rawhide (built independently, covering several Fedora releases)
  boards:
  - board: qemu
    level: community
    note: FVF claims support for mainstream RISC-V boards; not verified board by board
  - board: unmatched
    level: community
    note: As above; not verified board by board
  - board: visionfive2
    level: community
    note: As above; not verified board by board
  - board: licheepi-4a
    level: community
    note: As above; not verified board by board
  - board: meles
    level: community
    note: As above; not verified board by board
  - board: k3
    level: community
    note: As above; not verified board by board
  - board: a210
    level: community
    note: As above; not verified board by board
  - board: k230
    level: community
    note: As above; not verified board by board
  - board: megrez
    level: community
    note: As above; not verified board by board
  - board: titan
    level: community
    note: As above; not verified board by board
  - board: pioneer
    level: community
    note: As above; not verified board by board
  - board: orangepi-rv2
    level: community
    note: As above; not verified board by board
  - board: bpi-f3
    level: community
    note: As above; not verified board by board
  downloads:
  - label: FVF mirror (images.fedoravforce.org)
    url: https://images.fedoravforce.org
  - label: FVF download entry on the official site
    url: https://www.fedoravforce.org
  guides:
  - label: FVF official site (About/resources, Chinese/English toggle)
    url: https://www.fedoravforce.org
    type: doc
    lang: en
  - label: FVF Chinese home page
    url: https://www.fedoravforce.org/zh
    type: doc
    lang: zh
  - label: FVF blog (docs/tutorials)
    url: https://blog.fedoravforce.com
    type: doc
    lang: zh
  gotchas:
  - Images are built independently by the community, not through Fedora's signing/release process, and versions drift from upstream Fedora
  - The mirror is a JS single-page app, so scripts can't scrape the board list; pick your board by hand on the page
  doc_langs:
  - en
  - zh
  derivatives: []
  note: FVF is a RISC-V image rebuilt from Fedora sources by a separate team, not an official Fedora release. It covers more boards than the official SIG images, so it is the practical pick when you want
    a Fedora userland that boots out of the box.
  checked: '2026-11-01'
  order: 4
  feature: true
  sources:
