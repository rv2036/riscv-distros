- id: revyos
  name: RevyOS
  vendor: ''
  upstream: downstream
  upstream_note: 'Downstream vendor distro: maintained by PLCT Lab (Institute of Software, CAS) for the XuanTie/T-Head ecosystem, reusing the Debian 13 (trixie) package archive plus a XuanTie-customized
    kernel. It is neither an official Debian port nor an independent package base.'
  kind: distro
  based_on: Debian 13 (trixie) rootfs + XuanTie-customized 6.6 kernel (TH1520/SG2042 BSP); the older 20240720 build is Debian 12 + 5.10 kernel
  audience: recommended
  versions:
  - 20260504 (2026-05-04, newest full image on the mirror)
  - 20251226 (2025-12-26, newest version listed in the official docs)
  - 20250729 (2025-07-29)
  - 20240720 (2024-07-20, 5.10 kernel / Debian 12 era)
  boards:
  - board: licheepi-4a
    level: official
    note: 'The main reference board: SD/eMMC boot, the most complete images and docs'
  - board: meles
    level: official
    note: 'Milk-V Meles: official image 20260504 plus a flashing tutorial'
  - board: pioneer
    level: official
    note: 'Milk-V Pioneer (SG2042): image 20260504'
  - board: k3
    level: partial
    note: Provided as coreboot+OpenSBI+EDK2 firmware (Ruyi Firmware), not a full OS image
  downloads:
  - label: Mirror root (one directory per board)
    url: https://mirror.iscas.ac.cn/revyos/extra/images/
  - label: LicheePi 4A 20260504 (sdcard/img.zst + boot/root + u-boot)
    url: https://mirror.iscas.ac.cn/revyos/extra/images/lpi4a/20260504/
  - label: Milk-V Meles 20260504
    url: https://mirror.iscas.ac.cn/revyos/extra/images/meles/20260504/
  - label: Milk-V Pioneer (SG2042) 20260504
    url: https://mirror.iscas.ac.cn/revyos/extra/images/sg2042/20260504/
  - label: China-accelerated mirror fast-mirror.isrc.ac.cn
    url: https://fast-mirror.isrc.ac.cn/revyos/extra/images/lpi4a/20260504/
  guides:
  - label: Flashing notes (supported devices and image overview)
    url: https://docs.revyos.dev/docs/Installation/intro/
    type: doc
    lang: zh
  - label: LicheePi 4A flashing tutorial (Linux)
    url: https://docs.revyos.dev/docs/Installation/licheepi4a/
    type: doc
    lang: zh
  - label: Milk-V Meles flashing tutorial
    url: https://docs.revyos.dev/docs/Installation/milkv-meles/
    type: doc
    lang: zh
  - label: Milk-V Pioneer installation tutorial
    url: https://docs.revyos.dev/docs/Installation/milkv-pioneer/
    type: doc
    lang: zh
  - label: LicheePi 4A flashing guide (English)
    url: https://docs.revyos.dev/en/docs/Installation/licheepi4a/
    type: doc
    lang: en
  gotchas:
  - Version numbers are dates (YYYYMMDD), not semantic versions; the docs lag the mirror badly (docs say 20251226, the mirror already has 20260504)
  - Upgrading from 20240720 or earlier requires resetting the U-Boot environment (env default -a -f; env save; reset), otherwise it won't boot
  - Some SD cards are incompatible with the LicheePi 4A; the vendor maintains a compatibility list, and eMMC is the safer bet
  - The 20260926/20260924 directories hold coreboot+EDK2 firmware (no U-Boot), not system images; at the default 1.84GHz you must add cooling
  - GPU/NPU depend on the vendor BSP driver stack (there are separate revyos-gles-21 and NPU docs); not everything is upstream
  doc_langs:
  - zh
  - en
  derivatives: []
  note: 'The de facto standard on TH1520 boards: LicheePi 4A and Milk-V Meles ship with RevyOS, and the official tutorials flash it too. The best first pick for newcomers, but note that the mirror is newer
    than the docs — take the latest date from the mirror directory.'
  checked: '2026-11-01'
  order: 5
  feature: true
  sources:
  - https://mirror.iscas.ac.cn/revyos/extra/images/
  - https://mirror.iscas.ac.cn/revyos/extra/images/lpi4a/20260504/
  - https://mirror.iscas.ac.cn/revyos/extra/images/meles/20260504/
  - https://mirror.iscas.ac.cn/revyos/extra/images/sg2042/20260504/
  - https://fast-mirror.isrc.ac.cn/revyos/extra/images/lpi4a/20260504/
  - https://docs.revyos.dev/docs/Installation/intro/
  - https://docs.revyos.dev/docs/Installation/licheepi4a/
  - https://docs.revyos.dev/docs/Installation/milkv-meles/
  - https://docs.revyos.dev/docs/Installation/milkv-pioneer/
  - https://docs.revyos.dev/en/docs/Installation/licheepi4a/
  - https://matrix.ruyisdk.org/reports/LicheeCluster4A/RevyOS/README/
  - https://matrix.ruyisdk.org/reports/LicheeConsole4A/RevyOS/README/
  - https://matrix.ruyisdk.org/reports/LicheePi4A/RevyOS/README/
  - https://matrix.ruyisdk.org/reports/Meles/RevyOS/README/
  - https://matrix.ruyisdk.org/reports/Pioneer/RevyOS/README/
