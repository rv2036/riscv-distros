  - board: bpi-f3
    level: community
    note: 同上。ボードごとの検証はしていません
  downloads:
  - label: FVF ミラーサイト (images.fedoravforce.org)
    url: https://images.fedoravforce.org
  - label: FVF 公式サイトのダウンロード入口
    url: https://www.fedoravforce.org
  guides:
  - label: FVF 公式サイト（About／リソース、中英切替あり）
    url: https://www.fedoravforce.org
