# distros (ja)
items:
- id: debian
  name: Debian
  vendor: ''
  upstream: official
  upstream_note: Debian 13（trixie）以降、riscv64 は公式リリースアーキテクチャになりました。公式発表の原文は「This release for the first time officially supports the riscv64 architecture」。メインアーカイブ deb.debian.org に入っており、ports の追加ツリーではありません（debian.org/ports
    の一覧でも riscv64 は 13/released と表示されます）。
  kind: distro
  based_on: 独立
  audience: recommended
  versions:
  - 13.7（trixie、現行安定版、ISO は debian-13.7.0-riscv64-netinst.iso）
  - 14（forky、開発／テスト中）
  boards:
  - board: qemu
    level: official
    note: 公式の riscv64 netinst を QEMU virt 上にインストールできます。d-i の主要ターゲットプラットフォームです
  - board: unmatched
    level: community
    note: 汎用 riscv64 イメージ＋ボード側の U-Boot/UEFI で起動します。Debian はボード専用イメージを配布していません
  - board: visionfive2
    level: community
    note: 同上。JH7110 ボードはベンダー U-Boot で UEFI を提供し、その上に汎用イメージを入れます
  - board: licheepi-4a
    level: partial
    note: TH1520 はベンダー U-Boot／カーネルが必要で、Debian のメインラインにはボード対応がありません
  - board: meles
    level: partial
    note: 同じ TH1520 プラットフォームで、状況は LicheePi 4A と同様です
  - board: k3
    level: partial
    note: SpacemiT K3 はベンダー BSP が必要です。Debian メインラインでの対応状況は未確認です
  - board: a210
    level: partial
    note: 知合 A210 はベンダーのファームウェア／カーネルが必要で、Debian の公式サポートはありません
  - board: k230
    level: partial
    note: Canaan K230 は MCU 系の SoC で、メインラインの対応は限定的です
  - board: megrez
    level: community
    note: EIC7700 ボードは汎用 UEFI イメージで動く可能性がありますが、Debian のドキュメントでは確認できていません
  - board: titan
    level: community
    note: DP1000 も同様で、Debian のドキュメントでは確認できていません
  - board: pioneer
    level: community
    note: SG2042 は汎用イメージで動く可能性がありますが、Debian のドキュメントでは確認できていません
  - board: orangepi-rv2
    level: community
    note: SpacemiT K1 ボード。汎用イメージ＋ボード側 U-Boot で動きます
  - board: bpi-f3
    level: community
    note: SpacemiT K1 ボード。汎用イメージ＋ボード側 U-Boot で動きます
  downloads:
  - label: riscv64 CD イメージディレクトリ（cdimage、現行安定版）
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - label: debian-13.7.0-riscv64-netinst.iso への直リンク
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  guides:
  - label: Debian GNU/Linux 13 riscv64 インストールマニュアル（英語）
    url: https://www.debian.org/releases/stable/riscv64/
    type: doc
    lang: en
  - label: インストールマニュアル 簡体字中国語
    url: https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
    type: doc
    lang: zh
  - label: インストールマニュアル 日本語
    url: https://www.debian.org/releases/stable/riscv64/index.ja.html
    type: doc
    lang: ja
  - label: インストールマニュアル 韓国語
    url: https://www.debian.org/releases/stable/riscv64/index.ko.html
    type: doc
    lang: ko
  - label: インストールマニュアル ロシア語
    url: https://www.debian.org/releases/stable/riscv64/index.ru.html
    type: doc
    lang: ru
  - label: 'RISC-V Linux in 2026: Debian, RVA23, Servers, Hardware—and What''s Still Missing'
    url: https://www.youtube.com/watch?v=C5NkSlf4_WE
    type: video
    lang: en
  gotchas:
  - 配布されるのは汎用の riscv64 イメージ（netinst/ISO）だけで、ボード専用イメージはありません。起動できるかどうかはボード側の U-Boot/UEFI ファームウェア次第です
  - 公式インストールマニュアル自身が「This installation guide has not been fully updated and fact checked for riscv64」と明記しており、一部の章は古い可能性があります
  - netinst でのインストールはネットワーク接続が必須で、パッケージを取得しながら進みます
  doc_langs:
  - en
  - zh
  - ja
  - ko
  - ru
  - fr
  - de
  derivatives:
  - Ubuntu
  note: Debian は今回のリストで唯一、riscv64 を正式なリリースアーキテクチャに含めている独立系ディストリビューションです。派生には Deepin や RevyOS など、Debian をベースにした riscv64 システムもあります（個別の検証はしていません）。
  checked: '2026-11-01'
  order: 1
  feature: true
- id: ubuntu
  name: Ubuntu
  vendor: ''
  upstream: official
  upstream_note: Canonical が riscv64 イメージを公式にビルド・ホストしています（「built and hosted by Canonical」）。riscv64 は Ubuntu の公式サポートアーキテクチャです。26.04 LTS から ISA のベースラインが RVA23S64 に上がりました。
  kind: distro
  based_on: Debian
  audience: recommended
  versions:
  - 26.10（現行版、RVA23）
  - 26.04.1 LTS (RVA23)
  - 24.04.5 LTS（RVA20、旧ハードウェアも引き続きサポート）
  boards:
  - board: qemu
    level: official
    note: 26.10 / 26.04.1 LTS は Desktop、Server の live installer と preinstalled イメージを提供しています。公式ページに QEMU のインストール手順があります
  - board: unmatched
    level: official
    note: 24.04.5 LTS は ubuntu-24.04.5-preinstalled-server-riscv64+unmatched.img.xz を提供しています
  - board: visionfive2
    level: official
    note: jh7110 イメージ（24.04.5 LTS +jh7110、VisionFive 2 / VisionFive 2 Lite をカバー）
  - board: licheepi-4a
    level: partial
    note: 公式のボード一覧に LicheePi 4A はありません（Sipeed LicheeRV Dock のみ）。自前ビルドかコミュニティイメージが必要です
  - board: meles
    level: partial
    note: 公式のボード一覧に Milk-V Meles はありません
  - board: k3
    level: official
    note: SpacemiT K3 プラットフォーム（CoM260、picoITX、DeepComputing FML13V05）は 26.10 から対応しています
  - board: a210
    level: partial
    note: 公式のボード一覧に知合 A210 はありません
  - board: k230
    level: partial
    note: 公式のボード一覧に Canaan K230 はありません
  - board: megrez
    level: partial
    note: 公式のボード一覧に Milk-V Megrez はありません
  - board: titan
    level: partial
    note: 公式のボード一覧に Milk-V Titan はありません
  - board: pioneer
    level: partial
    note: 公式のボード一覧に Milk-V Pioneer はありません
  - board: orangepi-rv2
    level: partial
    note: 公式のボード一覧にあるのは Milk-V Mars（同じ K1）だけで、Orange Pi RV2 はありません
  - board: bpi-f3
    level: partial
    note: 公式のボード一覧に Banana Pi BPI-F3 はありません
  downloads:
  - label: Canonical 公式 RISC-V ダウンロードページ（ボード別にイメージを選択）
    url: https://ubuntu.com/download/risc-v/canonical-built
  - label: cdimage 26.10 riscv64 ディレクトリ
    url: https://cdimage.ubuntu.com/releases/26.10/release/
  - label: cdimage 26.04.1 LTS riscv64 ディレクトリ
    url: https://cdimage.ubuntu.com/releases/26.04/release/
  guides:
  - label: RISC-V ダウンロードページ内に各ボードのインストール手順（installation instructions）があります
    url: https://ubuntu.com/download/risc-v/canonical-built
    type: doc
    lang: en
  - label: Announcing Ubuntu desktop images for RISC-V (2026-10)
    url: https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
    type: doc
    lang: en
  gotchas:
  - 26.04 LTS から RVA23S64 が必須です。RVA23 非対応のハードウェア（VisionFive 2/JH7110、SiFive Unmatched など）は 24.04.5 LTS しか使えません。公式の原文は「Hardware that is not RVA23-ready continues to be supported by our 24.04.5 LTS release」
  - 一部のボード向けイメージは headless のみ（GPU なし、WiFi なし）です。公式ページでも DeepComputing FML13V01 の項目に明記されています
  - ボード向けイメージは +<board> のサフィックスで区別されます（+unmatched/+jh7110/+icicle/+nezha/+licheerv/+pic64gx）。間違ったイメージを書き込むと起動しません
  doc_langs:
  - en
  derivatives:
  - Ubuntu Base (riscv64 rootfs)
  - DeepComputing FML13V01 partner-built Ubuntu
  note: Ubuntu はボード対応が最も細かいところです。公式がボード別に preinstalled イメージを出していますが、26.04 からはハードルが RVA23 に上がり、古いボードは 24.04 LTS に留まります。
  checked: '2026-11-01'
  order: 2
  feature: true
- id: fedora
  name: Fedora
  vendor: ''
  upstream: community
  upstream_note: Fedora 公式 wiki の原文は「riscv64 is currently not an officially supported Fedora architecture」。イメージは Fedora RISC-V SIG が保守し、dl.fedoraproject.org/pub/alt/risc-v/（alt ツリー、メインアーキテクチャではない）に置かれています。リリースブロッキングには参加していません。
  kind: distro
  based_on: 独立
  audience: recommended
  versions:
  - 44（安定版、RISC-V イメージあり）
  - 45（Beta/RC、RISC-V イメージは "non-official, community-contributed" と明記）
  - rawhide
  boards:
  - board: qemu
    level: official
    note: 公式対応。メインラインカーネルのままで動きます（Hardware ページの QEMU 項目）
  - board: unmatched
    level: partial
    note: Hardware ページに SiFive Unmatched は載っていません（Premier P550 のみ）
  - board: visionfive2
    level: official
    note: StarFive JH7110 の項目で公式対応。NVMe/PCIe が不要ならメインラインカーネルで動きます
  - board: licheepi-4a
    level: partial
    note: Hardware ページに LicheePi 4A / TH1520 は載っていません
  - board: meles
    level: partial
    note: Hardware ページに Milk-V Meles は載っていません
  - board: k3
    level: official
    note: SpacemiT K3 の項目：K3 Pico-ITX、Milk-V Jupiter 2、K3-CoM260、DC-ROMA III (FML13V05)
  - board: a210
    level: partial
    note: Hardware ページに知合 A210 は載っていません
  - board: k230
    level: partial
    note: Hardware ページに Canaan K230 は載っていません
  - board: megrez
    level: official
    note: ESWIN EIC7700X の項目で公式対応（Milk-V Megrez、HiFive Premier P550）
  - board: titan
    level: official
    note: UltraRISC UR-DP1000 の項目で公式対応（Milk-V Titan）
  - board: pioneer
    level: official
    note: SOPHGO SG2042 の項目で公式対応（Milk-V Pioneer）
  - board: orangepi-rv2
    level: official
    note: SpacemiT M1/K1 の項目で公式対応（Orange Pi RV 2、BPI-F3、Milk-V Jupiter を含む）
  - board: bpi-f3
    level: official
    note: SpacemiT M1/K1 の項目で公式対応（Banana Pi BPI-F3）
  downloads:
  - label: Fedora RISC-V イメージ一覧ディレクトリ（alt/risc-v/releases）
    url: https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - label: Fedora Remix for RISC-V
    url: https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  guides:
  - label: Fedora RISC-V インストールガイド（wiki）
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Fedora RISC-V 対応ハードウェア一覧（wiki）
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
    type: doc
    lang: en
  - label: Fedora/RISC-V プロジェクトページ（wiki）
    url: https://fedoraproject.org/wiki/Architectures/RISC-V
    type: doc
    lang: en
  gotchas:
  - 多くのボードでは Omni カーネル（...riscv64.omni.fcXX）が必須です。標準の 7.x カーネルがカバーするのは VisionFive 2 / Orange Pi RV / Milk-V Mars 程度で、公式の原文は「Most boards can only boot when using the Omni kernel」
  - Omni カーネルには上流に取り込まれていないパッチが残っています（原文「Some patches in this kernel are still under review upstream」）
  - headless 専用と考えてください。メインラインに SoC 内蔵 GPU のドライバがなく、公式の位置づけはビルドマシン／サーバーです（「video output are pretty much completely ignored」）
  - インストールにはシリアルコンソールが必要です（Requirements → Serial console access）
  - 一部のパッケージには RISC-V 専用のパッチが必要で、上流のソースとはまだ差分があります
  doc_langs:
  - en
  derivatives:
  - Fedora-V Force (FVF)
  - Fedora Remix for RISC-V
  note: Fedora には公式の RISC-V SIG と継続ビルドがありますが、riscv64 はいまも「not officially supported」と明記され、イメージは alt チャネル配布です。日常利用に問題はありませんが、公式サポートの位置づけは Debian や Ubuntu とは同じではありません。
  checked: '2026-11-01'
  order: 3
  feature: true
- id: fvf
  name: Fedora-V Force (FVF)
  vendor: ''
  upstream: downstream
  upstream_note: Fedora-V Force（多啦V盟）は独立したチーム／コミュニティのプロジェクトで、Fedora 36 から rawhide までの riscv64 ビルドを自前でコンパイルしてボードに合わせています。公式サイトの説明は「independently compiling releases from Fedora 36 to rawhide」で、Fedora の公式リリースプロセスとは関係がありません。
  kind: distro
  based_on: Fedora
  audience: recommended
  versions:
