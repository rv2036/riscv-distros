  derivatives: []
  note: FVF は別チームが Fedora のソースから独自に再ビルドした RISC-V イメージで、Fedora 公式リリースではありません。公式 SIG のイメージより対応ボードが広く、箱から出して動く Fedora 環境が欲しい場合に実用的です。
  checked: '2026-11-01'
  order: 4
  feature: true
- id: revyos
  name: RevyOS
  vendor: ''
  upstream: downstream
  upstream_note: 下流のカスタムディストリビューションです。PLCT Lab（中国科学院ソフトウェア研究所）が XuanTie（T-Head）エコシステム向けに保守しており、Debian 13（trixie）のパッケージリポジトリと XuanTie 向けカスタムカーネルを組み合わせています。Debian の公式ポートでも、独立したパッケージ体系でもありません。
  kind: distro
  based_on: Debian 13 (trixie) の rootfs ＋ XuanTie カスタム 6.6 カーネル（TH1520/SG2042 BSP）。旧版 20240720 は Debian 12 ＋ 5.10 カーネル
  audience: recommended
  versions:
  - 20260504（2026-05-04、ミラーサイトで最新の完全イメージ）
  - 20251226（2025-12-26、公式ドキュメント記載の最新版）
  - 20250729（2025-07-29）
  - 20240720（2024-07-20、5.10 カーネル／Debian 12 の時代）
  boards:
  - board: licheepi-4a
    level: official
    note: 主力のリファレンスボード。SD/eMMC のデュアルブートで、イメージもドキュメントも最も充実しています
  - board: meles
    level: official
    note: Milk-V Meles。公式イメージ 20260504 と書き込みチュートリアルがあります
  - board: pioneer
    level: official
    note: Milk-V Pioneer（SG2042）。イメージは 20260504
  - board: k3
    level: partial
    note: coreboot+OpenSBI+EDK2 ファームウェア（Ruyi Firmware）として提供されており、OS イメージそのものではありません
  downloads:
  - label: ミラーサイトのトップディレクトリ（ボードごとに分割）
    url: https://mirror.iscas.ac.cn/revyos/extra/images/
  - label: LicheePi 4A 20260504（sdcard/img.zst ＋ boot/root ＋ u-boot）
    url: https://mirror.iscas.ac.cn/revyos/extra/images/lpi4a/20260504/
  - label: Milk-V Meles 20260504
    url: https://mirror.iscas.ac.cn/revyos/extra/images/meles/20260504/
  - label: Milk-V Pioneer (SG2042) 20260504
    url: https://mirror.iscas.ac.cn/revyos/extra/images/sg2042/20260504/
  - label: 国内向け高速ミラー fast-mirror.isrc.ac.cn
    url: https://fast-mirror.isrc.ac.cn/revyos/extra/images/lpi4a/20260504/
  guides:
  - label: イメージ書き込みの注意（対応デバイスとイメージ一覧）
    url: https://docs.revyos.dev/docs/Installation/intro/
    type: doc
    lang: zh
  - label: LicheePi 4A 書き込みチュートリアル（Linux）
    url: https://docs.revyos.dev/docs/Installation/licheepi4a/
    type: doc
    lang: zh
  - label: Milk-V Meles 書き込みチュートリアル
    url: https://docs.revyos.dev/docs/Installation/milkv-meles/
    type: doc
    lang: zh
  - label: Milk-V Pioneer インストールチュートリアル
    url: https://docs.revyos.dev/docs/Installation/milkv-pioneer/
    type: doc
    lang: zh
  - label: LicheePi 4A flashing guide (English)
    url: https://docs.revyos.dev/en/docs/Installation/licheepi4a/
    type: doc
    lang: en
  gotchas:
  - バージョン番号は日付（YYYYMMDD）で、セマンティックバージョニングではありません。公式ドキュメントはミラーサイトより遅れがちです（ドキュメントは 20251226、ミラーサイトには 20260504 があります）
  - 20240720 以前からアップグレードする場合は U-Boot の環境変数をリセットする必要があります（env default -a -f; env save; reset）。しないと起動しません
  - LicheePi 4A は一部の SD カードで互換性の問題があります。公式が SD カード互換リストを保守しているので、eMMC を優先するのがおすすめです
  - 20260926/20260924 のディレクトリは coreboot+EDK2 ファームウェア（U-Boot なし）で、システムイメージではありません。既定の 1.84GHz で回すなら放熱対策が必須です
  - GPU/NPU はベンダー BSP のドライバスタックに依存します（revyos-gles-21、NPU のドキュメントも別途あり）。すべてがメインラインに入っているわけではありません
  doc_langs:
  - zh
