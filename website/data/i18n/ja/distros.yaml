  - board: unmatched
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: visionfive2
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: licheepi-4a
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: meles
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: k3
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: a210
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: k230
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: megrez
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: titan
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: pioneer
    level: community
    note: 同上。ボードごとの検証はしていません
  - board: orangepi-rv2
    level: community
