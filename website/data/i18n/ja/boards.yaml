# ja board entries
items:
- id: qemu
  name: QEMU virt 仮想マシン
  soc: なし（QEMU の汎用仮想プラットフォーム。RV32/RV64 を構成可能、最大 512 コア）
  vendor: QEMU Project
  spec: 純粋な仮想プラットフォームです。最大 512 個の RV64GC コア、CLINT/PLIC、PCIe ホストブリッジ、8 個の virtio-mmio、NS16550 UART、オプションの AIA/IOMMU を備えます。メモリ、ディスク、ネットワークはすべてコマンドライン引数で仮想化され、実物の GPU/VPU/NPU はありません。
  status: virtual
  price_note: 無料のオープンソース（GPLv2）で、各ディストリビューションのリポジトリから入手できます
  forms: []
  official_os:
  - debian
  - ubuntu
  distros:
  - distro: debian
    level: official
    note: Debian 13 から riscv64 が正式アーキテクチャになり、公式 netinst ISO をそのまま virt に入れられます
  - distro: ubuntu
    level: official
    note: 公式 riscv64 cloud image。EDK2（pflash）か -kernel で起動します
  - distro: fedora
    level: community
    note: Fedora RISC-V が QEMU のインストール手順とイメージを提供
  - distro: alpine
    level: official
    note: riscv64 minirootfs だけで virt 用 ISO はなく、カーネル／initramfs を自分で用意します
  - distro: arch
    level: official
    note: archriscv が riscv64 ISO を提供し、QEMU で起動できます
  - distro: opensuse
    level: community
    note: openSUSE Ports が riscv64 を提供。公式サイトは curl に 403 を返すため、直リンクは未検証です
  - distro: gentoo
    level: official
    note: stage3 riscv64 ＋ マニュアルで QEMU 上のシステム構築に対応
  - distro: void
    level: partial
    note: riscv64 ポートはありますが、QEMU イメージは自分でビルドします
  - distro: nixos
    level: community
    note: riscv64 は非公式サポート扱いで、クロスビルドが必要です
  - distro: alt
    level: official
    note: ALT Ports の riscv64 が QEMU イメージを提供
  - distro: freebsd
    level: official
    note: riscv64 が QEMU virt に対応
  - distro: netbsd
    level: official
    note: riscv64 ポートが QEMU に対応
  - distro: openbsd
    level: official
    note: riscv64 が QEMU virt に対応
  - distro: openeuler
    level: official
    note: openEuler RISC-V SIG が QEMU イメージを提供
  - distro: buildroot
    level: official
    note: qemu_riscv64_virt_defconfig。make 一行でシステムが起動します
  - distro: yocto
    level: official
    note: qemuriscv64 マシンを公式サポート
  downloads:
  - label: QEMU 公式ドキュメント：RISC-V virt マシン
    url: https://www.qemu.org/docs/master/system/riscv/virt.html
  - label: QEMU ダウンロードページ
    url: https://www.qemu.org/download/
  - label: Ubuntu 24.04 riscv64 cloud image
    url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-riscv64.img
  - label: Debian 13.7 riscv64 netinst ISO
    url: https://cdimage.debian.org/debian-cd/current/riscv64/iso-cd/
  - label: Arch Linux RISC-V ISO
    url: https://archriscv.felixc.at/images/archlinux-2026.08.27-riscv64.iso
  - label: Alpine riscv64 minirootfs
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - label: Buildroot ダウンロード
    url: https://buildroot.org/downloads/
  guides:
  - label: 'QEMU wiki: RISC-V プラットフォームの説明'
    url: https://wiki.qemu.org/Documentation/Platforms/RISCV
    type: doc
    lang: en
  - label: 'Debian wiki: RISC-V ポート'
    url: https://wiki.debian.org/RISC-V
    type: doc
    lang: en
  - label: 'Fedora: RISC-V インストールガイド'
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Gentoo RISC-V プロジェクト
    url: https://wiki.gentoo.org/wiki/Project:RISC-V
    type: doc
    lang: en
  - label: openEuler RISC-V SIG
    url: https://www.openeuler.org/en/sig/sig-RISC-V
    type: doc
    lang: en
  gotchas:
  - -bios default は OpenSBI しか読み込まず、U-Boot/EDK2 は入っていません。Ubuntu/Fedora の cloud image を起動するには 32MiB の EDK2 ファームウェアを pflash で読み込ませる必要があり、しないと画面が真っ暗になります
  - virt には GPU/VPU/NPU がありません。グラフィックス、動画のハードウェアデコード、AI アクセラレーションの検証には使わないでください
  - シリアルは常に ttyS0 です。-nographic モードを抜けるには Ctrl-A を押してから X を押します
  - Ubuntu 26.04 から RVA23S64 が必須で、古い QEMU は拡張が足りず起動しません。24.04 は今も RVA20 ベースラインです
  - Alpine の riscv64 は minirootfs のみで virt 用 ISO がないため、カーネルと initramfs を自分で用意する必要があります
  doc_langs:
  - en
  note: すべてのボードの共通の出発点です。まず virt でカーネル／rootfs を検証してから実機に移ると、書き込みやトラブルシュートの時間を大幅に節約できます。
  checked: '2026-11-01'
  order: 1
  feature: true
