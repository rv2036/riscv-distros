  vendor: Sipeed
  spec: 4/8/16GB LPDDR4X、8/32/128GB eMMC、2×ギガビット Ethernet、WiFi5/BT5、HDMI 2.0 ＋ 4-lane MIPI DSI、2×MIPI CSI、4×USB3、40-pin GPIO。
