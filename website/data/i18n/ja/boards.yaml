- id: visionfive2
  name: StarFive VisionFive 2
  soc: StarFive JH7110：4×SiFive U74 @1.5GHz + S7 モニタコア + E24
  vendor: StarFive
  spec: 2/4/8GB LPDDR4、microSD ＋ eMMC（一部の版）、M.2 M-Key NVMe、2×ギガビット Ethernet（v1.3 は PoE 対応）、HDMI 2.0、4×USB、40-pin GPIO。簡素版の VisionFive 2 Lite もあります。
