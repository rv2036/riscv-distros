# AI software support (ja)
ruyisdk:
  url: https://matrix.ruyisdk.org/
  fetched_at: '2026-11-01'
  note: RuyiSDK 公式の「RISC-V Board and OS Support Matrix」です。フロントエンドは Astro の静的サイトで、/table/ ページの本文は JS でレンダリングされます。データの出所は GitHub リポジトリ ruyisdk/support-matrix で（ボード／ディストリビューションのディレクトリごとに README.md があり、その YAML
    frontmatter がデータ源）、今回は git sparse clone で 951 個の md ファイルをすべて取得して解析したため、サイトのデータと等価です。マトリクスの粒度は「起動できるか／デスクトップに入れるか」というサポート段階で、パッケージ単位の可用性は含みません。「RuyiSDK で直接書き込めるか」は ruyi_provisioning を参照してください。
items:
- board: qemu
  board_name: QEMU virt 仮想マシン
  soc: QEMU エミュレート rv64（vlen=256, RVV 1.0）
  runs:
  - item: llama.cpp
    state: works
    evidence:
    - https://github.com/kriznaw/llama.cpp-riscv64-qemu
    - https://raw.githubusercontent.com/ggml-org/llama.cpp/master/docs/build-riscv64-spacemit.md
    note: qemu-riscv64 -cpu max,vlen=256 で上流ビルドを実行できます。SpacemiT のドキュメントには qemu で llama-cli を動かす完全なコマンド例があります。あくまで機能確認で、速度に意味はありません。
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: build_riscv64.sh はクロスコンパイル成果物の検証に qemu を使っており、動きますが非常に遅いです。
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: RISE の wheel は「QEMU ビルドではない」と明記しており、qemu 上では機能確認しかできません。
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: エミュレーション環境でも動作しますが、性能的な意味はありません。
  - item: ncnn
    state: works
    evidence:
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: CI は riscv64 上で通っています。
  npu: なし（純粋なエミュレーション）
  note: ハードウェアがないときにコンパイルと機能を確認するためのもので、性能の根拠にはできません。
  checked: '2026-11-01'
  order: 1
