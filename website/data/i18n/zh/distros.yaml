# zh distro entries
items:
- id: debian
  name: Debian
  vendor: ''
  upstream: official
  upstream_note: Debian 13 (trixie) 起 riscv64 为官方发布架构——官方新闻稿原文："This release for the first time officially supports the riscv64 architecture"；进入主归档 deb.debian.org，不是 ports 附加树（debian.org/ports 列表中 riscv64
    标注 13/released）。
  kind: distro
  based_on: 独立
  audience: recommended
  versions:
  - 13.7 (trixie, 当前稳定, ISO 为 debian-13.7.0-riscv64-netinst.iso)
  - 14 (forky, 开发/测试中)
  boards:
  - board: qemu
    level: official
    note: 官方 riscv64 netinst 在 QEMU virt 上安装，是 d-i 的主要目标平台
  - board: unmatched
    level: community
    note: 通用 riscv64 镜像 + 板端 U-Boot/UEFI 启动；Debian 不发布板级镜像
  - board: visionfive2
    level: community
    note: 同上，JH7110 板用厂商 U-Boot 提供 UEFI 后装通用镜像
  - board: licheepi-4a
    level: partial
    note: TH1520 需厂商 U-Boot/内核，Debian 主线无板级支持
  - board: meles
    level: partial
    note: 同为 TH1520 平台，情况与 LicheePi 4A 类似
  - board: k3
    level: partial
    note: SpacemiT K3 需厂商 BSP；Debian 主线支持情况未确认
  - board: a210
    level: partial
    note: 知合 A210 需厂商固件/内核，无 Debian 官方支持
  - board: k230
    level: partial
    note: Canaan K230 为 MCU 类 SoC，主线支持有限
  - board: megrez
    level: community
    note: EIC7700 板可走通用 UEFI 镜像，未在 Debian 文档确认
  - board: titan
    level: community
    note: DP1000 同上，未在 Debian 文档确认
  - board: pioneer
    level: community
    note: SG2042 可走通用镜像，未在 Debian 文档确认
  - board: orangepi-rv2
    level: community
    note: SpacemiT K1 板，通用镜像 + 板端 U-Boot
  - board: bpi-f3
    level: community
    note: SpacemiT K1 板，通用镜像 + 板端 U-Boot
  downloads:
  - label: riscv64 光盘镜像目录 (cdimage, 当前稳定版)
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - label: debian-13.7.0-riscv64-netinst.iso 直链
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  guides:
  - label: Debian GNU/Linux 13 riscv64 安装手册 (英文)
    url: https://www.debian.org/releases/stable/riscv64/
    type: doc
    lang: en
  - label: 安装手册 简体中文
    url: https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
    type: doc
    lang: zh
  - label: 安装手册 日本語
    url: https://www.debian.org/releases/stable/riscv64/index.ja.html
    type: doc
    lang: ja
  - label: 安装手册 한국어
    url: https://www.debian.org/releases/stable/riscv64/index.ko.html
    type: doc
    lang: ko
  - label: 安装手册 Русский
    url: https://www.debian.org/releases/stable/riscv64/index.ru.html
    type: doc
    lang: ru
  - label: 'RISC-V Linux in 2026: Debian, RVA23, Servers, Hardware—and What''s Still Missing'
    url: https://www.youtube.com/watch?v=C5NkSlf4_WE
    type: video
    lang: en
  gotchas:
  - 只发布通用 riscv64 镜像（netinst/ISO），没有板级镜像；能否启动取决于板端 U-Boot/UEFI 固件
  - 官方安装手册自我声明："This installation guide has not been fully updated and fact checked for riscv64"，部分章节可能过时
  - netinst 安装需联网拉取软件包
  doc_langs:
  - en
  - zh
  - ja
  - ko
  - ru
  - fr
  - de
  derivatives:
  - Ubuntu
  note: Debian 是这批里唯一把 riscv64 放进正式发布架构的独立发行版；衍生作品另有 Deepin、RevyOS 等基于 Debian 的 riscv64 系统（未逐项核实）。
  checked: '2026-11-01'
  order: 1
  feature: true
  sources:
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  - https://www.debian.org/releases/stable/riscv64/
  - https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
  - https://www.debian.org/releases/stable/riscv64/index.ja.html
  - https://www.debian.org/releases/stable/riscv64/index.ko.html
  - https://www.debian.org/releases/stable/riscv64/index.ru.html
  - https://www.youtube.com/watch?v=C5NkSlf4_WE
  - https://matrix.ruyisdk.org/reports/K230/Debian/README/
  - https://matrix.ruyisdk.org/reports/Mars/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo256m/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo_S/Debian/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Debian/README/
  - https://matrix.ruyisdk.org/
- id: ubuntu
  name: Ubuntu
  vendor: ''
  upstream: official
  upstream_note: Canonical 官方构建并托管 riscv64 镜像（"built and hosted by Canonical"），riscv64 是 Ubuntu 官方支持架构；26.04 LTS 起 ISA 基线升到 RVA23S64。
  kind: distro
  based_on: Debian
  audience: recommended
  versions:
  - 26.10 (当前版, RVA23)
  - 26.04.1 LTS (RVA23)
  - 24.04.5 LTS (RVA20, 旧硬件继续支持)
  boards:
  - board: qemu
    level: official
    note: 26.10 / 26.04.1 LTS 提供 Desktop、Server live installer 与 preinstalled 镜像，官方页有 QEMU 安装说明
  - board: unmatched
    level: official
    note: 24.04.5 LTS 提供 ubuntu-24.04.5-preinstalled-server-riscv64+unmatched.img.xz
  - board: visionfive2
    level: official
    note: jh7110 镜像（24.04.5 LTS +jh7110，覆盖 VisionFive 2 / VisionFive 2 Lite）
  - board: licheepi-4a
    level: partial
    note: 官方板卡列表里没有 LicheePi 4A（只有 Sipeed LicheeRV Dock），需自建/社区镜像
  - board: meles
    level: partial
    note: 官方板卡列表无 Milk-V Meles
  - board: k3
    level: official
    note: SpacemiT K3 平台（CoM260、picoITX、DeepComputing FML13V05）自 26.10 起支持
  - board: a210
    level: partial
    note: 官方板卡列表无知合 A210
  - board: k230
    level: partial
    note: 官方板卡列表无 Canaan K230
  - board: megrez
    level: partial
    note: 官方板卡列表无 Milk-V Megrez
  - board: titan
    level: partial
    note: 官方板卡列表无 Milk-V Titan
  - board: pioneer
    level: partial
    note: 官方板卡列表无 Milk-V Pioneer
  - board: orangepi-rv2
    level: partial
    note: 官方板卡列表只有 Milk-V Mars（同 K1），无 Orange Pi RV2
  - board: bpi-f3
    level: partial
    note: 官方板卡列表无 Banana Pi BPI-F3
  downloads:
  - label: Canonical 官方 RISC-V 下载页（按板卡选镜像）
    url: https://ubuntu.com/download/risc-v/canonical-built
  - label: cdimage 26.10 riscv64 目录
    url: https://cdimage.ubuntu.com/releases/26.10/release/
  - label: cdimage 26.04.1 LTS riscv64 目录
    url: https://cdimage.ubuntu.com/releases/26.04/release/
  guides:
  - label: RISC-V 下载页内含各板安装说明 (installation instructions)
    url: https://ubuntu.com/download/risc-v/canonical-built
    type: doc
    lang: en
  - label: Announcing Ubuntu desktop images for RISC-V (2026-10)
    url: https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
    type: doc
    lang: en
  gotchas:
  - 26.04 LTS 起要求 RVA23S64：非 RVA23 硬件（VisionFive 2/JH7110、SiFive Unmatched 等）只能用 24.04.5 LTS，官方原文 "Hardware that is not RVA23-ready continues to be supported by our 24.04.5 LTS release"
  - 部分板卡镜像仅支持 headless（无 GPU、无 WiFi），官方页面在 DeepComputing FML13V01 条目明确写了这一点
  - 板级镜像按 +<board> 后缀区分（+unmatched/+jh7110/+icicle/+nezha/+licheerv/+pic64gx），下错镜像会起不来
  doc_langs:
  - en
  derivatives:
  - Ubuntu Base (riscv64 rootfs)
  - DeepComputing FML13V01 partner-built Ubuntu
  note: Ubuntu 是板级支持做得最细的一家：官方按板发 preinstalled 镜像，但 26.04 起把门槛抬到 RVA23，老板被锁在 24.04 LTS。
  checked: '2026-11-01'
  order: 2
  feature: true
  sources:
  - https://ubuntu.com/download/risc-v/canonical-built
  - https://cdimage.ubuntu.com/releases/26.10/release/
  - https://cdimage.ubuntu.com/releases/26.04/release/
  - https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
  - https://matrix.ruyisdk.org/reports/K230/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Mars/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo256m/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo_S/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Ubuntu/README_LTS/
  - https://matrix.ruyisdk.org/
- id: fedora
  name: Fedora
  vendor: ''
  upstream: community
  upstream_note: Fedora 官方 wiki 原文："riscv64 is currently not an officially supported Fedora architecture"。镜像由 Fedora RISC-V SIG 维护，放在 dl.fedoraproject.org/pub/alt/risc-v/（alt 树，非主架构），不参与 release blocking。
  kind: distro
  based_on: 独立
  audience: recommended
  versions:
  - 44 (稳定版, 已有 RISC-V 镜像)
  - 45 (Beta/RC, RISC-V 镜像标注 "non-official, community-contributed")
  - rawhide
  boards:
  - board: qemu
    level: official
    note: 官方支持，用 mainline 内核即可（Hardware 页 QEMU 条目）
  - board: unmatched
    level: partial
    note: Hardware 页未列 SiFive Unmatched（只列了 Premier P550）
  - board: visionfive2
    level: official
    note: StarFive JH7110 条目官方支持；不需要 NVMe/PCIe 时可用 mainline 内核
  - board: licheepi-4a
    level: partial
    note: Hardware 页未列 LicheePi 4A / TH1520
  - board: meles
    level: partial
    note: Hardware 页未列 Milk-V Meles
  - board: k3
    level: official
    note: SpacemiT K3 条目：K3 Pico-ITX、Milk-V Jupiter 2、K3-CoM260、DC-ROMA III (FML13V05)
  - board: a210
    level: partial
    note: Hardware 页未列知合 A210
  - board: k230
    level: partial
    note: Hardware 页未列 Canaan K230
  - board: megrez
    level: official
    note: ESWIN EIC7700X 条目官方支持（Milk-V Megrez、HiFive Premier P550）
  - board: titan
    level: official
    note: UltraRISC UR-DP1000 条目官方支持（Milk-V Titan）
  - board: pioneer
    level: official
    note: SOPHGO SG2042 条目官方支持（Milk-V Pioneer）
  - board: orangepi-rv2
    level: official
    note: SpacemiT M1/K1 条目官方支持（含 Orange Pi RV 2、BPI-F3、Milk-V Jupiter）
  - board: bpi-f3
    level: official
    note: SpacemiT M1/K1 条目官方支持（Banana Pi BPI-F3）
  downloads:
  - label: Fedora RISC-V 镜像总目录 (alt/risc-v/releases)
    url: https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - label: Fedora Remix for RISC-V
    url: https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  guides:
  - label: Fedora RISC-V 安装指南 (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Fedora RISC-V 支持硬件列表 (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
    type: doc
    lang: en
  - label: Fedora/RISC-V 项目主页 (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V
    type: doc
    lang: en
  gotchas:
  - 多数板子必须用 Omni 内核（...riscv64.omni.fcXX），标准 7.x 内核只覆盖 VisionFive 2 / Orange Pi RV / Milk-V Mars 一类，官方原文 "Most boards can only boot when using the Omni kernel"
  - Omni 内核里仍有 patch 未上游（原文 "Some patches in this kernel are still under review upstream"）
  - 只适合 headless：mainline 不含 SoC 集显驱动，官方定位是构建机/服务器（"video output are pretty much completely ignored"）
  - 安装需要串口控制台（Requirements → Serial console access）
  - 部分软件包需要 RISC-V 专用 patch，与上游源码仍有 delta
  doc_langs:
  - en
  derivatives:
  - Fedora-V Force (FVF)
  - Fedora Remix for RISC-V
  note: Fedora 有官方 RISC-V SIG 与持续构建，但官方至今把 riscv64 写作「not officially supported」，镜像走 alt 通道。日常使用没问题，只是它的「官方支持」等级与 Debian、Ubuntu 不同级。
  checked: '2026-11-01'
  order: 3
  feature: true
  sources:
  - https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
  - https://fedoraproject.org/wiki/Architectures/RISC-V
  - https://matrix.ruyisdk.org/reports/Bit-Brick_K1/Fedora/README/
  - https://matrix.ruyisdk.org/reports/BPI-F3/Fedora/README/
  - https://matrix.ruyisdk.org/reports/K230/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheeCluster4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheePi4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/Mars/Fedora/README/
  - https://matrix.ruyisdk.org/
