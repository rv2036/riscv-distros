- id: revyos
  name: RevyOS
  vendor: ''
  upstream: downstream
  upstream_note: 下游定制发行版：PLCT Lab（中科院软件所）为玄铁/T-Head（XuanTie）生态维护，复用 Debian 13 (trixie) 软件包仓 + 玄铁定制内核，不是 Debian 官方 port，也不是独立包体系。
  kind: distro
  based_on: Debian 13 (trixie) rootfs + 玄铁定制 6.6 内核（TH1520/SG2042 BSP）；旧版 20240720 为 Debian 12 + 5.10 内核
  audience: recommended
  versions:
  - 20260504（2026-05-04，镜像站最新完整镜像）
  - 20251226（2025-12-26，官方文档标注的最新版）
  - 20250729（2025-07-29）
  - 20240720（2024-07-20，5.10 内核 / Debian 12 时代）
  boards:
  - board: licheepi-4a
    level: official
    note: 主力参考板，SD/eMMC 双启动，镜像与文档最全
  - board: meles
    level: official
    note: Milk-V Meles，官方镜像 20260504 + 刷写教程
  - board: pioneer
    level: official
    note: Milk-V Pioneer（SG2042），镜像 20260504
  - board: k3
    level: partial
    note: 以 coreboot+OpenSBI+EDK2 固件形式提供（Ruyi Firmware），非完整 OS 镜像
  downloads:
  - label: 镜像站总目录（按开发板分目录）
    url: https://mirror.iscas.ac.cn/revyos/extra/images/
  - label: LicheePi 4A 20260504（sdcard/img.zst + boot/root + u-boot）
    url: https://mirror.iscas.ac.cn/revyos/extra/images/lpi4a/20260504/
  - label: Milk-V Meles 20260504
    url: https://mirror.iscas.ac.cn/revyos/extra/images/meles/20260504/
  - label: Milk-V Pioneer (SG2042) 20260504
    url: https://mirror.iscas.ac.cn/revyos/extra/images/sg2042/20260504/
  - label: 国内加速镜像 fast-mirror.isrc.ac.cn
    url: https://fast-mirror.isrc.ac.cn/revyos/extra/images/lpi4a/20260504/
  guides:
  - label: 镜像刷写需知（支持设备与镜像一览）
    url: https://docs.revyos.dev/docs/Installation/intro/
    type: doc
    lang: zh
  - label: LicheePi 4A 刷写教程（Linux）
    url: https://docs.revyos.dev/docs/Installation/licheepi4a/
    type: doc
    lang: zh
  - label: Milk-V Meles 刷写教程
    url: https://docs.revyos.dev/docs/Installation/milkv-meles/
    type: doc
    lang: zh
  - label: Milk-V Pioneer 安装教程
    url: https://docs.revyos.dev/docs/Installation/milkv-pioneer/
    type: doc
    lang: zh
  - label: LicheePi 4A flashing guide (English)
    url: https://docs.revyos.dev/en/docs/Installation/licheepi4a/
    type: doc
    lang: en
  gotchas:
  - 版本号是日期（YYYYMMDD），不是语义化版本；官方文档页长期滞后于镜像站（文档写 20251226，镜像站已有 20260504）
  - 从 20240720 及更早版本升级必须重置 U-Boot 环境变量（env default -a -f; env save; reset），否则无法启动
  - LicheePi 4A 部分 SD 卡存在兼容性问题，官方维护 SD 卡兼容清单，建议优先 eMMC
