    level: official
    note: openEuler RISC-V SIG 提供 QEMU 镜像
  - distro: buildroot
    level: official
    note: qemu_riscv64_virt_defconfig，一行 make 起系统
  - distro: yocto
    level: official
    note: qemuriscv64 machine 官方支持
  - distro: almalinux
    level: official
    note: ''
  - distro: rocky
    level: partial
    note: ''
  - distro: rhel
    level: partial
    note: ''
  downloads:
  - label: QEMU 官方文档：RISC-V virt 机型
    url: https://www.qemu.org/docs/master/system/riscv/virt.html
  - label: QEMU 下载页
    url: https://www.qemu.org/download/
  - label: Ubuntu 24.04 riscv64 cloud image
    url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-riscv64.img
  - label: Debian 13.7 riscv64 netinst ISO
    url: https://cdimage.debian.org/debian-cd/current/riscv64/iso-cd/
  - label: Arch Linux RISC-V ISO
    url: https://archriscv.felixc.at/images/archlinux-2026.08.27-riscv64.iso
  - label: Alpine riscv64 minirootfs
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - label: Buildroot 下载
    url: https://buildroot.org/downloads/
  guides:
  - label: 'QEMU wiki: RISC-V 平台说明'
    url: https://wiki.qemu.org/Documentation/Platforms/RISCV
    type: doc
    lang: en
  - label: 'Debian wiki: RISC-V 端口'
    url: https://wiki.debian.org/RISC-V
    type: doc
    lang: en
  - label: 'Fedora: RISC-V 安装指南'
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Gentoo RISC-V 项目
    url: https://wiki.gentoo.org/wiki/Project:RISC-V
    type: doc
    lang: en
  - label: openEuler RISC-V SIG
    url: https://www.openeuler.org/en/sig/sig-RISC-V
    type: doc
    lang: en
  gotchas:
  - -bios default 只加载 OpenSBI，没有 U-Boot/EDK2；启动 Ubuntu/Fedora cloud image 需用 pflash 加载 32MiB EDK2 固件，否则黑屏
  - virt 没有 GPU/VPU/NPU，别用它验证图形、视频硬解或 AI 加速
  - 串口固定是 ttyS0；-nographic 模式退出要按 Ctrl-A 再按 X
  - Ubuntu 26.04 起要求 RVA23S64，旧版 QEMU 缺扩展会起不来；24.04 仍是 RVA20 基线
  - Alpine riscv64 只发 minirootfs，没有 virt ISO，需要自己准备内核和 initramfs
  doc_langs:
  - en
  note: 所有板子的公共起点：先在 virt 上验证内核/rootfs，再上真机，能省掉大量刷机排错时间。
  checked: '2026-11-01'
  order: 1
  feature: true
