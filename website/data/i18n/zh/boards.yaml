# zh board entries
items:
- id: qemu
  name: QEMU virt 虚拟机型
  soc: 无（QEMU 通用虚拟平台，可配 RV32/RV64，最多 512 核）
  vendor: QEMU Project
  spec: 纯虚拟平台：最多 512 个 RV64GC 核、CLINT/PLIC、PCIe 主机桥、8 个 virtio-mmio、NS16550 UART、可选 AIA/IOMMU；内存、磁盘、网络全部由命令行参数虚拟，无真实 GPU/VPU/NPU。
  status: virtual
  price_note: 免费开源（GPLv2），随各发行版软件源提供
  forms: []
  official_os:
  - debian
  - ubuntu
  distros:
  - distro: debian
    level: official
    note: Debian 13 起 riscv64 为正式架构，官方 netinst ISO 可直接装进 virt
  - distro: ubuntu
    level: official
    note: 官方 riscv64 cloud image，配 EDK2(pflash) 或 -kernel 启动
  - distro: fedora
    level: community
    note: Fedora RISC-V 提供 QEMU 安装说明与镜像
  - distro: alpine
    level: official
    note: 只有 riscv64 minirootfs，无 virt ISO，需自备内核/initramfs
  - distro: arch
    level: official
    note: archriscv 提供 riscv64 ISO，可在 QEMU 启动
  - distro: opensuse
    level: community
    note: openSUSE Ports 提供 riscv64；官网对 curl 返回 403，未验证直链
  - distro: gentoo
    level: official
    note: stage3 riscv64 + 手册支持 QEMU 系统
  - distro: void
    level: partial
    note: 有 riscv64 端口，QEMU 镜像需自行构建
  - distro: nixos
    level: community
    note: riscv64 非官方支持等级，需交叉构建
  - distro: alt
    level: official
    note: ALT Ports riscv64 提供 QEMU 镜像
  - distro: freebsd
    level: official
    note: riscv64 支持 QEMU virt
  - distro: netbsd
    level: official
    note: riscv64 端口支持 QEMU
