# AI 软件支持（中文母版）
ruyisdk:
  url: https://matrix.ruyisdk.org/
  fetched_at: '2026-11-01'
  note: RuyiSDK 官方「RISC-V Board and OS Support Matrix」；前端为 Astro 静态站点，/table/ 页面正文由 JS 渲染，数据直接来自 GitHub 仓库 ruyisdk/support-matrix （每个 板/发行版 目录一个 README.md，YAML frontmatter 即数据源），本次以 git sparse clone 拉取全部
    951 个 md 文件后解析，等价于站点数据。矩阵粒度是「能否启动/能否进桌面」的支持等级，不含逐软件包可用性；「RuyiSDK 可直接刷写」另见 ruyi_provisioning。
items:
- board: qemu
  board_name: QEMU virt 虚拟机型
  soc: QEMU 模拟 rv64（vlen=256, RVV 1.0）
  runs:
  - item: llama.cpp
    state: works
    evidence:
    - https://github.com/kriznaw/llama.cpp-riscv64-qemu
    - https://raw.githubusercontent.com/ggml-org/llama.cpp/master/docs/build-riscv64-spacemit.md
    note: 可用 qemu-riscv64 -cpu max,vlen=256 运行上游构建；SpacemiT 文档给出完整 qemu 跑 llama-cli 的命令。仅功能验证，速度无参考意义。
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: build_riscv64.sh 依赖 qemu 做交叉编译产物验证；可跑但极慢。
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: RISE 轮子明确说明「非 QEMU 构建」，qemu 下仅能验证功能。
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: 模拟环境可运行，无性能意义。
  - item: ncnn
    state: works
    evidence:
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: CI 在 riscv64 上跑通。
  npu: 无（纯模拟）
  note: 仅用于无硬件时验证编译与功能，不能作为性能依据。
  checked: '2026-11-01'
  order: 1
