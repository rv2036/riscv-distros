    level: official
    note: Официально продвигаемая, последний системный образ 20251226 (на базе Debian + kernel 6.6)
  - distro: debian
    level: partial
    note: Mainline Debian 13 загружается на LPi4A, но нужно самостоятельно подготовить U-Boot/DTB; официального образа установщика нет
  - distro: ubuntu
    level: partial
    note: Есть только ubuntu-base rootfs, ядро и загрузку нужно настраивать самостоятельно
