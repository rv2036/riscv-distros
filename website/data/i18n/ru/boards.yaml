    url: https://wiki.gentoo.org/wiki/User:Dlan/RISC-V/TH1520
  - label: Образ deepin RISC-V
    url: https://deepin-community.github.io/sig-deepin-ports/images/riscv64
  - label: Образ openKylin для LPi4A (сообщество)
    url: https://github.com/aiminickwong/licheepi4a-images
  guides:
  - label: Описание платы в Sipeed Wiki (английский)
    url: https://wiki.sipeed.com/hardware/en/lichee/th1520/lpi4a/1_intro.html
    type: doc
    lang: en
  - label: Описание платы в Sipeed Wiki (китайский)
    url: https://wiki.sipeed.com/hardware/zh/lichee/th1520/lpi4a/1_intro.html
    type: doc
    lang: zh
  - label: Сайт документации RevyOS
    url: https://docs.revyos.dev/
    type: doc
    lang: en
  - label: Матрица поддержки RuyiSDK (статус практической проверки для каждого дистрибутива)
    url: https://matrix.ruyisdk.org/
    type: doc
    lang: zh
  gotchas:
  - GPU — Imagination BXM-4-64, доступен только закрытый blob от производителя, в mainline-ядре нет ускорения GPU; для NPU нужен специальный SDK от T-Head
  - 'В партиях 16GB, отгруженных до 2023.8.1, в U-Boot есть баг определения ОЗУ: необходимо прошить специальный u-boot для 16G, иначе приложения с большим объёмом памяти будут падать'
  - Для прошивки нужно зажать кнопку BOOT и затем подать питание, чтобы войти в fastboot (USB 2345:7654); при обычной подаче питания режим загрузки не включается
  - При обновлении с RevyOS ≤20240720 необходимо сначала выполнить `env default -a -f; env save`, чтобы сбросить переменные окружения U-Boot
  - Версии 8GB и 16GB имеют разные device tree в boot.ext4 — при перекрёстной прошивке плата не загрузится
  - С 2026-09 RevyOS продвигает новую прошивку coreboot+EDK2 (вместо U-Boot SPL); это экспериментально — перед прошивкой уточните модель платы
  doc_langs:
  - en
  - zh
  note: Самая документированная и с самым большим сообществом плата на TH1520; рабочий стол RevyOS работает, но закрытые GPU/NPU — серьёзный недостаток. Есть также производные от сообщества сборки вроде
    openwrt (не входят в стандартный id дистрибутива).
