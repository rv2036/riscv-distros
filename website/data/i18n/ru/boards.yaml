  - label: Коллекция образов Sipeed Wiki (китайский, самая полная информация)
    url: https://wiki.sipeed.com/hardware/zh/lichee/th1520/lpi4a/3_images.html
  - label: Официальный диск загрузок Sipeed (спецификации/схемы/инструменты)
    url: https://dl.sipeed.com/shareURL/LICHEE/licheepi4a
