- id: licheepi-4a
  name: LicheePi 4A
  soc: T-Head TH1520：4×C910 @1.85GHz + C906 + E902，4TOPS NPU
  vendor: Sipeed
  spec: 4/8/16GB LPDDR4X, 8/32/128GB eMMC, 2× гигабитных Ethernet, WiFi5/BT5, HDMI 2.0 + 4-lane MIPI DSI, 2× MIPI CSI, 4× USB3, 40-pin GPIO.
  status: on_sale
  price_note: 8GB около US$120, 16GB около US$180 (цены каналов продаж, не проверено)
