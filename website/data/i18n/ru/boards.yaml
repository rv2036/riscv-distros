- id: visionfive2
  name: StarFive VisionFive 2
  soc: StarFive JH7110 — 4×SiFive U74 @1.5GHz + ядро мониторинга S7 + E24
  vendor: StarFive
  spec: 2/4/8GB LPDDR4, microSD + eMMC (в некоторых версиях), M.2 M-Key NVMe, 2×гигабитный Ethernet (v1.3 поддерживает PoE), HDMI 2.0, 4×USB, 40-pin GPIO; также есть упрощённая версия VisionFive 2 Lite.
  status: on_sale
  price_note: Стандартная версия 2/4/8GB около US$60–120 (не проверено); фактическая цена VisionFive 2 Lite в рознице US$99.95
  forms: []
  official_os:
