    level: community
    note: openEuler RISC-V SIG предоставляет образы
  - distro: openkylin
    level: community
    note: Образ openKylin от сообщества
  - distro: deepin
    level: community
    note: Портированная версия deepin RISC-V
  - distro: buildroot
