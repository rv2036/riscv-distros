- id: milkv-duo
  name: Серия Milk-V Duo (Duo / Duo 256M / Duo S)
  soc: CV1800B（Duo）/ SG2002（Duo 256M）/ SG2000（Duo S）
  vendor: Milk-V
  spec: 'Duo: 2×C906 (1 ГГц + 700 МГц) + 8051, 64 МБ SIP DRAM; Duo 256M: SG2002 плюс 1×Cortex-A53, 256 МБ; Duo S: 512 МБ + площадка eMMC (в некоторых комплектах 8 ГБ) + WiFi6; у всех есть порт 100M и USB-C;
    Duo/256M — 26×контактных площадок GPIO, 21×51 мм, Duo S — 2×26-pin гребёнка, 43×43 мм.'
  status: on_sale
  price_note: Duo US$4.99, Duo S US$9.99 (фактическая цена в официальном магазине Arace); Duo 256M около US$7.99
  forms: []
  official_os:
  - buildroot
  distros:
  - distro: buildroot
    level: official
    note: Официальный Buildroot SDK V1/V2, записал на карту и пользуйся — самая стабильная система
  - distro: fedora
    level: community
    note: Образ Fedora 41 (Fedora-V Force, зеркало ISCAS)
  - distro: debian
    level: community
    note: sophgo-sg200x-debian от Fishwaldo/scpcom, покрывает 256M/S
  - distro: ubuntu
    level: community
    note: Образ Ubuntu 22.04 от сообщества (bassusteur)
  - distro: arch
    level: community
    note: Образ Arch от сообщества
  - distro: alpine
    level: community
    note: Образ Alpine от сообщества (cwt)
  - distro: nixos
    level: community
    note: Поддерживается сообществом, функциональность ограничена
  - distro: yocto
    level: community
    note: Слой meta-milkv
  - distro: openeuler
    level: community
    note: В openEuler есть образ Duo
  downloads:
  - label: Сводка официальных образов Milk-V (включая таблицу сторонних образов)
    url: https://milkv.io/docs/duo/getting-started/download
  - label: Официальные релизы Buildroot SDK V1
    url: https://github.com/milkv-duo/duo-buildroot-sdk/releases
  - label: Официальные релизы Buildroot SDK V2 (двойные образы RISC-V+ARM для 256M/S)
    url: https://github.com/milkv-duo/duo-buildroot-sdk-v2/releases
  - label: Образ Fedora 41 для Duo (ISCAS)
    url: https://mirror.iscas.ac.cn/fedora-riscv/dl/Milk-V/Duo/images/latest/
  - label: Debian (sophgo-sg200x-debian)
    url: https://github.com/Fishwaldo/sophgo-sg200x-debian
  - label: Зеркало сообщества Alpine (PoC)
    url: https://github.com/cwt/duo-buildroot-sdk/releases/tag/poc1
  guides:
  - label: Обзор Duo (на английском)
    url: https://milkv.io/docs/duo/overview
    type: doc
    lang: en
  - label: Быстрый старт с Duo
    url: https://milkv.io/docs/duo/getting-started/duo
    type: doc
    lang: en
  - label: Описание Duo 256M
    url: https://milkv.io/docs/duo/getting-started/duo256m
    type: doc
    lang: en
  - label: Руководство по сборке Buildroot SDK
    url: https://milkv.io/docs/duo/getting-started/buildroot-sdk
    type: doc
    lang: en
  - label: Статус поддержки в upstream mainline (прогресс по патчам)
    url: https://milkv.io/docs/duo/resources/upstream-status
    type: doc
    lang: en
  - label: Описание поддержки mainline Linux
    url: https://milkv.io/docs/duo/resources/mainline
    type: doc
    lang: en
  gotchas:
  - '64MB ОЗУ у Duo слишком мало: AI-приложения из образа V2 не запускаются, официально рекомендуется для 64M использовать образ V1'
  - По умолчанию только сетевой адаптер USB-NCM (192.168.42.1), без DHCP; на хосте нужно вручную настроить IP в той же подсети; пароль root — milkv
  - 'Поддержка в mainline-ядре неполная: minimal вошёл с 6.7, GPIO — с 6.8, clock/SPI/I2C/MMC/USB — только с 6.9–6.10, camera/VPU/NPU/часть clock всё ещё на review'
  - Duo 256M/S имеет ядро ARM Cortex-A53; образы RISC-V и ARM нельзя прошивать вперемешку
  - HDMI нет, у Duo S тоже только MIPI DSI; для подключения экрана нужно отдельно покупать переходную плату
  - 'У Duo S есть переключатель BOOT: при неверном положении не войти в режим загрузки/прошивки; питание только 5V/1A, не подключайте мощное зарядное устройство'
  doc_langs:
  - en
  - zh
  note: Входной гаджет уровня US$5, подходит для изучения встраиваемого Linux/RTOS, не для использования в качестве десктопа; перед покупкой уточните, 64M или 256M/S — образы полностью несовместимы. Есть
    также производные версии сообщества, например openwrt (не входят в стандартный id дистрибутива).
  checked: '2026-11-01'
  order: 17
  feature: false
  sources:
