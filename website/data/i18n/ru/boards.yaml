# ru board entries
items:
- id: qemu
  name: Виртуальная машина QEMU virt
  soc: нет (универсальная виртуальная платформа QEMU, настраивается RV32/RV64, до 512 ядер)
  vendor: QEMU Project
  spec: 'Чисто виртуальная платформа: до 512 ядер RV64GC, CLINT/PLIC, хост-мост PCIe, 8 virtio-mmio, NS16550 UART, опционально AIA/IOMMU; ОЗУ, накопитель и сеть полностью виртуализируются параметрами командной
    строки, реальных GPU/VPU/NPU нет.'
  status: virtual
  price_note: Бесплатно, с открытым исходным кодом (GPLv2), поставляется в репозиториях дистрибутивов
  forms: []
  official_os:
  - debian
  - ubuntu
  distros:
  - distro: debian
    level: official
    note: Начиная с Debian 13 riscv64 — официальная архитектура, официальный netinst ISO можно напрямую установить в virt
  - distro: ubuntu
    level: official
    note: Официальный cloud image riscv64, запуск с EDK2(pflash) или -kernel
  - distro: fedora
    level: community
    note: Fedora RISC-V предоставляет инструкцию по установке QEMU и образы
  - distro: alpine
    level: official
    note: Есть только riscv64 minirootfs, без virt ISO, нужны собственные ядро/initramfs
  - distro: arch
    level: official
    note: archriscv предоставляет riscv64 ISO, можно загрузить в QEMU
  - distro: opensuse
    level: community
    note: openSUSE Ports предоставляет riscv64; официальный сайт возвращает 403 на curl, прямые ссылки не проверены
  - distro: gentoo
    level: official
    note: stage3 riscv64 + руководство по поддержке системы QEMU
  - distro: void
    level: partial
    note: Есть порт riscv64, образ QEMU нужно собирать самостоятельно
  - distro: nixos
    level: community
    note: riscv64 — неофициальный уровень поддержки, требуется кросс-сборка
  - distro: alt
    level: official
    note: ALT Ports riscv64 предоставляет образ QEMU
  - distro: freebsd
    level: official
    note: riscv64 поддерживает QEMU virt
  - distro: netbsd
    level: official
    note: Порт riscv64 поддерживает QEMU
  - distro: openbsd
    level: official
    note: riscv64 поддерживает QEMU virt
  - distro: openeuler
    level: official
    note: openEuler RISC-V SIG предоставляет образ QEMU
  - distro: buildroot
    level: official
    note: qemu_riscv64_virt_defconfig, система поднимается одной командой make
  - distro: yocto
    level: official
    note: Машина qemuriscv64 официально поддерживается
  - distro: almalinux
    level: official
    note: ''
  - distro: rocky
    level: partial
    note: ''
  - distro: rhel
    level: partial
    note: ''
  downloads:
  - label: 'Официальная документация QEMU: машина RISC-V virt'
    url: https://www.qemu.org/docs/master/system/riscv/virt.html
  - label: Страница загрузки QEMU
    url: https://www.qemu.org/download/
  - label: Облачный образ Ubuntu 24.04 riscv64
    url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-riscv64.img
  - label: ISO netinst Debian 13.7 riscv64
    url: https://cdimage.debian.org/debian-cd/current/riscv64/iso-cd/
  - label: ISO Arch Linux RISC-V
    url: https://archriscv.felixc.at/images/archlinux-2026.08.27-riscv64.iso
  - label: minirootfs Alpine riscv64
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - label: Загрузка Buildroot
    url: https://buildroot.org/downloads/
  guides:
  - label: 'QEMU wiki: описание платформы RISC-V'
    url: https://wiki.qemu.org/Documentation/Platforms/RISCV
    type: doc
    lang: en
  - label: 'Debian wiki: порт RISC-V'
    url: https://wiki.debian.org/RISC-V
    type: doc
    lang: en
  - label: 'Fedora: руководство по установке RISC-V'
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Проект Gentoo RISC-V
    url: https://wiki.gentoo.org/wiki/Project:RISC-V
    type: doc
    lang: en
  - label: openEuler RISC-V SIG
    url: https://www.openeuler.org/en/sig/sig-RISC-V
    type: doc
    lang: en
  gotchas:
  - -bios default загружает только OpenSBI, без U-Boot/EDK2; для загрузки облачного образа Ubuntu/Fedora нужно загрузить 32MiB прошивку EDK2 через pflash, иначе будет чёрный экран
  - В virt нет GPU/VPU/NPU, не используйте его для проверки графики, аппаратного декодирования видео или AI-ускорения
  - Последовательный порт фиксирован — ttyS0; для выхода из режима -nographic нажмите Ctrl-A, затем X
  - Начиная с Ubuntu 26.04 требуется RVA23S64, старые версии QEMU без нужных расширений не запустятся; 24.04 всё ещё использует базовый уровень RVA20
  - Alpine riscv64 выпускает только minirootfs, без virt ISO; ядро и initramfs нужно готовить самостоятельно
  doc_langs:
  - en
  note: 'Общая отправная точка для всех плат: сначала проверить ядро/rootfs на virt, затем переходить на реальное железо — это экономит массу времени на отладку прошивки.'
  checked: '2026-11-01'
  order: 1
  feature: true
