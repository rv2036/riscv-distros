  - label: Руководство по установке Fedora RISC-V
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  gotchas:
  - 'U-Boot/SPL находится в QSPI Flash, образ жёстко привязан к прошивке: образы после 202310 требуют U-Boot ≥ v3.1.5 в QSPI, иначе сначала нужно прошить u-boot-spl.bin.normal.out + visionfive2_fw_payload.img'
  - 'Порядок загрузки: QSPI → SD/eMMC/NVMe; неверное положение DIP-переключателей приведёт к загрузке с неправильного носителя'
  - Для старых плат v1.2 есть сообщения о неудачной прошивке Debian 202510; рекомендуется сначала обновить прошивку или перейти на mainline Debian
  - Официальный Debian 202510 от StarFive не поддерживает загрузку с USB; mainline Debian 13 загружается с USB, но без драйверов HDMI/GPU/VPU
  - У VisionFive 2 Lite и стандартной версии разные U-Boot/DTB, образы нельзя использовать взаимозаменяемо
  - Для загрузки с eMMC/SD есть известные errata; предпочтительны NVMe или качественная SD-карта
  doc_langs:
  - en
  - zh
  note: Плата на JH7110 с самой полной экосистемой и самым широким охватом дистрибутивов, один из первых выборов для первой RISC-V платы у новичка; обратите внимание на различия прошивок по партиям. Также
    есть производные от сообщества версии openwrt/dietpi/guix и др. (не включены в id стандартных дистрибутивов).
