    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: MLAS RVV-ядра из upstream-сборки riscv64 рассчитаны на RVV 1.0; векторы 0.7.1 у TH1520 напрямую не используются, приходится откатываться к скалярному режиму.
