    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: Колёса RISE требуют glibc≥2.39 и оптимизированы под RVV 1.0; на RevyOS/Debian устанавливаются, но без векторного ускорения.
