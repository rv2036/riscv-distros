# AI software support (ru)
ruyisdk:
  url: https://matrix.ruyisdk.org/
  fetched_at: '2026-11-01'
  note: Официальная «RISC-V Board and OS Support Matrix» от RuyiSDK; фронтенд — статический сайт Astro, текст страницы /table/ рендерится через JS, данные берутся напрямую из репозитория GitHub ruyisdk/support-matrix
    (в каталоге каждой платы/дистрибутива один README.md, YAML frontmatter — источник данных); в этот раз после git sparse clone получен 951 md-файл, все они разобраны, что эквивалентно данным сайта. Гранулярность
    матрицы — уровень поддержки «загружается/входит в рабочий стол», без доступности отдельных пакетов; о «RuyiSDK может прошивать напрямую» см. отдельно ruyi_provisioning.
items:
- board: qemu
  board_name: Виртуальная машина QEMU virt
  soc: QEMU эмулирует rv64 (vlen=256, RVV 1.0)
  runs:
  - item: llama.cpp
    state: works
    evidence:
    - https://github.com/kriznaw/llama.cpp-riscv64-qemu
    - https://raw.githubusercontent.com/ggml-org/llama.cpp/master/docs/build-riscv64-spacemit.md
    note: Можно запускать upstream-сборку через qemu-riscv64 -cpu max,vlen=256; документация SpacemiT приводит полную команду запуска llama-cli в qemu. Только проверка функциональности, скорость не показательна.
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: build_riscv64.sh зависит от qemu для проверки результатов кросс-компиляции; работает, но крайне медленно.
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: Колёса RISE явно указывают «сборка не в QEMU»; под qemu можно проверить только функциональность.
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: В эмуляторе запускается, производительность не имеет значения.
  - item: ncnn
    state: works
    evidence:
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: CI проходит на riscv64.
  npu: Нет (чистая эмуляция)
  note: Только для проверки компиляции и функциональности при отсутствии железа; не может служить основанием для оценки производительности.
  checked: '2026-11-01'
  order: 1
- board: unmatched
  board_name: SiFive HiFive Unmatched
  soc: SiFive FU740 (4x U74, RV64GC, без V)
  runs:
  - item: llama.cpp
    state: unknown
    evidence:
    - https://github.com/ggml-org/llama.cpp
    - https://github.com/ggml-org/llama.cpp/issues/20988
    note: Публичных практических проверок именно для Unmatched не найдено; upstream предоставляет только исходники (в release нет бинарников riscv64), у U74 нет RVV, доступен только скалярный путь, ожидается
      очень медленно.
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    - https://github.com/microsoft/onnxruntime
    note: В upstream есть MLAS RVV kernel и tools/scripts/build_riscv64.sh (вклад SiFive), но нет предсобранных пакетов riscv64 — нужна самостоятельная кросс-компиляция; RVV kernel рассчитан на RVV 1.0.
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    - https://pypi.riseproject.dev/simple/torch/
    note: На PyPI нет колёс riscv64; RISE предоставляет колёса torch 2.13.0 manylinux_2_39_riscv64 (требуется glibc≥2.39, например Ubuntu 24.04/Bianbu).
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: Upstream 4.x поддерживает RISC-V и RVV HAL; большинство дистрибутивов можно установить или собрать самостоятельно с бэкендом RVV. Проверка производительности по каждой плате не проводилась.
  - item: ncnn
    state: partial
    evidence:
    - https://github.com/Tencent/ncnn
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: В upstream есть linux-riscv64 CI и реализация RVV; у U74 нет RVV, ncnn работает только в скалярном режиме.
  - item: tengine
    state: partial
    evidence:
    - https://raw.githubusercontent.com/OAID/Tengine/tengine-lite/README_EN.md
    - https://github.com/OAID/Tengine/tree/tengine-lite/source/device/cpu/op/conv/risc-v
    note: tengine-lite предоставляет RVV-ядра свёртки для risc-v/lp64dv и инструментарий rv64-c906, оптимизированы только некоторые операторы — экспериментальная поддержка.
  npu: NPU отсутствует
  note: ruyi предоставляет образы OpenBSD/Ubuntu/openKylin/openWrt; экосистема зрелая, но блока AI-ускорения нет.
  checked: '2026-11-01'
