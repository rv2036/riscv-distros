    state: partial
    evidence:
    - https://github.com/Tencent/ncnn
    note: Собирается, RVV-оптимизации рассчитаны на 1.0, на 0.7.1 деградируют до скалярного режима.
  - item: tengine
    state: partial
    evidence:
    - https://github.com/OAID/Tengine/tree/tengine-lite/source/device/cpu/op/conv/risc-v
    note: tengine-lite поставляется с toolchain rv64-c906 и RVV-ядрами свёртки — как раз для ядер 0.7.1 вроде C906/C910, но покрывает только часть операторов.
  - item: npu-sdk (HHB)
    state: partial
    evidence:
    - https://raw.githubusercontent.com/sipeed/sipeed_wiki/main/docs/hardware/en/lichee/th1520/lpi4a/8_application.md
    note: 'В официальной wiki описан процесс для NPU: компилятор T-Head HHB компилирует ONNX в исполняемый файл для NPU (int8/int16 с фиксированной точкой), нужен специальный docker-образ; инструментарий
      закрытый и поддерживает только фиксированную точку — для LLM не подходит.'
  npu: 4 TOPS@INT8, только закрытый инструментарий производителя HHB (int8/int16 с фиксированной точкой), открытых upstream-драйверов нет
  note: Запуск LLM на CPU возможен, но медленный (~6 с/токен); NPU работает только через закрытый HHB от T-Head, Transformer LLM на нём не запустить.
