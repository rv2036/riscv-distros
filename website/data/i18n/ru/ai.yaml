- board: k3
  board_name: SpacemiT K3 (Pico-ITX / CoM260)
  soc: SpacemiT K3 (ядро A100, RV64GCV + RVV 1.0)
  runs:
  - item: llama.cpp
    state: works
    evidence:
    - https://raw.githubusercontent.com/ggml-org/llama.cpp/master/docs/build-riscv64-spacemit.md
    note: 'В официальной документации upstream llama.cpp есть отдельная глава build-riscv64-spacemit.md: A100 использует RISCV64_SPACEMIT_IME2, практическая проверка qwen3 0.6B Q4_0 показала pp128 565.8
      / tg128 55.8 t/s, qwen3 4B Q4_0 — pp128 79.7 / tg128 11.3 t/s (8 потоков).'
  - item: spacemit-llama.cpp (производитель)
    state: works
    evidence:
    - https://archive.spacemit.com/spacemit-ai/llama.cpp/
    - https://docs.bit-brick.com/docs/k1/ml/llama-cpp
    note: SpacemiT предоставляет предсобранный spacemit-llama.cpp.riscv64 (уже версии 0.0.9) вместе с библиотекой моделей на archive.spacemit.com; в документации Bit-Brick описано использование llama-cli/llama-server.
  - item: onnxruntime
    state: works
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: Ядро с RVV 1.0 может полностью задействовать upstream MLAS RVV kernel, но собрать нужно самостоятельно.
  - item: pytorch
    state: works
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    - https://pypi.riseproject.dev/simple/torch/
    note: В дистрибутивах с glibc≥2.39, таких как Bianbu, можно напрямую установить riscv64-колёса torch 2.13.0 от RISE (колёса имеют тег manylinux_2_39_riscv64).
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: RVV 1.0 + RVV HAL — оптимальное сочетание.
  - item: ncnn
    state: works
    evidence:
    - https://github.com/Tencent/ncnn
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: RVV 1.0, покрыто upstream CI.
  - item: tengine
    state: partial
    evidence:
    - https://github.com/OAID/Tengine/tree/tengine-lite/source/device/cpu/op/conv/risc-v
    note: Работает, но оптимизация рассчитана на 0.7.1 C906, на 1.0 выигрыш ограничен.
  - item: spacemit-ai-sdk
    state: works
    evidence:
    - https://archive.spacemit.com/spacemit-ai/
    note: archive.spacemit.com/spacemit-ai/ предоставляет ModelZoo, llama.cpp, localai, dify и другие артефакты — это один из самых полных вендорских AI-стеков на текущий момент в RISC-V.
  npu: K3 делает ставку на CPU+AI-ядро (расширение SpacemiT IME), отдельной универсальной модели программирования NPU нет; ускорение идёт через закрытые инструкции SpacemiT и AI SDK
  note: 'На данный момент это наиболее полный AI-стек среди RISC-V SBC: upstream llama.cpp напрямую включает его kernel.'
  checked: '2026-11-01'
