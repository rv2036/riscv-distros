  - https://matrix.ruyisdk.org/reports/Duo_S/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Ubuntu/README_LTS/
  - https://matrix.ruyisdk.org/
- id: fedora
  name: Fedora
  vendor: ''
  upstream: community
  upstream_note: 'Официальная wiki Fedora, оригинал: "riscv64 is currently not an officially supported Fedora architecture". Образы поддерживаются Fedora RISC-V SIG и размещены на dl.fedoraproject.org/pub/alt/risc-v/
    (дерево alt, не основная архитектура), не участвуют в release blocking.'
  kind: distro
  based_on: Независимый
  audience: recommended
  versions:
  - 44 (стабильная версия, образ RISC-V уже есть)
  - 45 (Beta/RC, образ RISC-V помечен как "non-official, community-contributed")
  - rawhide
  boards:
  - board: qemu
    level: official
    note: Официальная поддержка, достаточно mainline ядра (запись QEMU на странице Hardware)
  - board: unmatched
    level: partial
    note: На странице Hardware не указан SiFive Unmatched (указан только Premier P550)
  - board: visionfive2
    level: official
    note: Запись StarFive JH7110 официально поддерживается; если NVMe/PCIe не нужны, можно использовать ядро mainline
  - board: licheepi-4a
    level: partial
    note: На странице Hardware не указан LicheePi 4A / TH1520
  - board: meles
    level: partial
    note: На странице Hardware не указан Milk-V Meles
  - board: k3
    level: official
    note: 'Запись SpacemiT K3: K3 Pico-ITX, Milk-V Jupiter 2, K3-CoM260, DC-ROMA III (FML13V05)'
  - board: a210
    level: partial
    note: На странице Hardware не указана плата Zhihe A210
  - board: k230
    level: partial
    note: На странице Hardware не указан Canaan K230
  - board: megrez
    level: official
    note: Запись ESWIN EIC7700X официально поддерживается (Milk-V Megrez, HiFive Premier P550)
  - board: titan
    level: official
    note: Запись UltraRISC UR-DP1000 официально поддерживается (Milk-V Titan)
  - board: pioneer
    level: official
    note: Запись SOPHGO SG2042 официально поддерживается (Milk-V Pioneer)
  - board: orangepi-rv2
    level: official
    note: Запись SpacemiT M1/K1 официально поддерживается (включая Orange Pi RV 2, BPI-F3, Milk-V Jupiter)
  - board: bpi-f3
    level: official
    note: Официальная поддержка SpacemiT M1/K1 (Banana Pi BPI-F3)
  downloads:
  - label: Общий каталог образов Fedora RISC-V (alt/risc-v/releases)
    url: https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - label: Fedora Remix for RISC-V
    url: https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  guides:
  - label: Руководство по установке Fedora RISC-V (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Список поддерживаемого оборудования Fedora RISC-V (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
    type: doc
    lang: en
  - label: Домашняя страница проекта Fedora/RISC-V (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V
    type: doc
    lang: en
  gotchas:
  - 'Для большинства плат необходимо использовать ядро Omni (...riscv64.omni.fcXX); стандартное ядро 7.x покрывает только VisionFive 2 / Orange Pi RV / Milk-V Mars и подобные; в оригинале: "Most boards
    can only boot when using the Omni kernel"'
  - 'В ядре Omni всё ещё есть патчи, не принятые в upstream (в оригинале: "Some patches in this kernel are still under review upstream")'
  - 'Подходит только для headless: mainline не содержит драйвера встроенной графики SoC, официальное позиционирование — сборочная машина/сервер ("video output are pretty much completely ignored")'
  - Для установки требуется последовательная консоль (Requirements → Serial console access)
  - Некоторые пакеты требуют патчей специально для RISC-V, всё ещё есть расхождения с исходным кодом upstream
  doc_langs:
  - en
  derivatives:
  - Fedora-V Force (FVF)
  - Fedora Remix for RISC-V
  note: У Fedora есть официальный SIG RISC-V с непрерывными сборками, но riscv64 по-прежнему помечен как «not officially supported», а образы публикуются в канале alt. В повседневной работе это не мешает,
    однако уровень поддержки не тот же, что у Debian или Ubuntu.
  checked: '2026-11-01'
  order: 3
  feature: true
  sources:
  - https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
  - https://fedoraproject.org/wiki/Architectures/RISC-V
  - https://matrix.ruyisdk.org/reports/Bit-Brick_K1/Fedora/README/
  - https://matrix.ruyisdk.org/reports/BPI-F3/Fedora/README/
  - https://matrix.ruyisdk.org/reports/K230/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheeCluster4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheePi4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/Mars/Fedora/README/
  - https://matrix.ruyisdk.org/
