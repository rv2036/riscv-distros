# ru distro entries
items:
- id: debian
  name: Debian
  vendor: ''
  upstream: official
  upstream_note: 'Начиная с Debian 13 (trixie) riscv64 является официальной архитектурой релиза — цитата из официального пресс-релиза: "This release for the first time officially supports the riscv64 architecture";
    входит в основной архив deb.debian.org, а не в дополнительное дерево ports (в списке debian.org/ports у riscv64 указано 13/released).'
  kind: distro
  based_on: Независимый
  audience: recommended
  versions:
  - 13.7 (trixie, текущая стабильная, ISO — debian-13.7.0-riscv64-netinst.iso)
  - 14 (forky, в разработке/тестировании)
  boards:
  - board: qemu
    level: official
    note: Официальный riscv64 netinst устанавливается на QEMU virt и является основной целевой платформой d-i
  - board: unmatched
    level: community
    note: Универсальный образ riscv64 + загрузка через U-Boot/UEFI на плате; Debian не выпускает образы для конкретных плат
  - board: visionfive2
    level: community
    note: То же самое; для плат JH7110 используется U-Boot от производителя, который предоставляет UEFI, после чего устанавливается универсальный образ
  - board: licheepi-4a
    level: partial
    note: Для TH1520 требуется U-Boot/ядро от производителя; в mainline Debian поддержки на уровне платы нет
  - board: meles
    level: partial
    note: Та же платформа TH1520, ситуация аналогична LicheePi 4A
  - board: k3
    level: partial
    note: Для SpacemiT K3 требуется BSP от производителя; поддержка в mainline Debian не подтверждена
  - board: a210
    level: partial
    note: Для Zhihe A210 требуются прошивка/ядро от производителя, официальной поддержки Debian нет
  - board: k230
    level: partial
    note: Canaan K230 — SoC класса MCU, поддержка в mainline ограничена
  - board: megrez
    level: community
    note: Платы EIC7700 могут использовать универсальный образ UEFI, в документации Debian это не подтверждено
  - board: titan
    level: community
    note: DP1000 — то же самое, в документации Debian не подтверждено
  - board: pioneer
    level: community
    note: SG2042 может использовать универсальный образ, в документации Debian не подтверждено
  - board: orangepi-rv2
    level: community
    note: Плата SpacemiT K1, универсальный образ + U-Boot на плате
  - board: bpi-f3
    level: community
    note: Плата SpacemiT K1, универсальный образ + U-Boot на плате
  downloads:
  - label: Каталог CD-образов riscv64 (cdimage, текущая стабильная версия)
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - label: Прямая ссылка на debian-13.7.0-riscv64-netinst.iso
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  guides:
  - label: Руководство по установке Debian GNU/Linux 13 riscv64 (на английском)
    url: https://www.debian.org/releases/stable/riscv64/
    type: doc
    lang: en
  - label: Руководство по установке, упрощённый китайский
    url: https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
    type: doc
    lang: zh
  - label: Руководство по установке, японский
    url: https://www.debian.org/releases/stable/riscv64/index.ja.html
    type: doc
    lang: ja
  - label: Руководство по установке, 한국어
    url: https://www.debian.org/releases/stable/riscv64/index.ko.html
    type: doc
    lang: ko
  - label: Руководство по установке, Русский
    url: https://www.debian.org/releases/stable/riscv64/index.ru.html
    type: doc
    lang: ru
  - label: 'RISC-V Linux in 2026: Debian, RVA23, Servers, Hardware—and What''s Still Missing'
    url: https://www.youtube.com/watch?v=C5NkSlf4_WE
    type: video
    lang: en
  gotchas:
  - Публикуются только универсальные образы riscv64 (netinst/ISO), образов для конкретных плат нет; возможность загрузки зависит от прошивки U-Boot/UEFI на стороне платы
  - 'Официальное руководство по установке содержит оговорку: "This installation guide has not been fully updated and fact checked for riscv64", часть разделов может быть устаревшей'
  - Установка netinst требует подключения к сети для загрузки пакетов
  doc_langs:
  - en
  - zh
  - ja
  - ko
  - ru
  - fr
  - de
  derivatives:
  - Ubuntu
  note: Debian — единственный независимый дистрибутив в этой подборке, включивший riscv64 в число официально поддерживаемых архитектур релиза; есть и производные системы на базе Debian для riscv64, например
    Deepin и RevyOS (по каждому пункту не проверялось).
  checked: '2026-11-01'
  order: 1
  feature: true
  sources:
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  - https://www.debian.org/releases/stable/riscv64/
  - https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
  - https://www.debian.org/releases/stable/riscv64/index.ja.html
  - https://www.debian.org/releases/stable/riscv64/index.ko.html
  - https://www.debian.org/releases/stable/riscv64/index.ru.html
  - https://www.youtube.com/watch?v=C5NkSlf4_WE
  - https://matrix.ruyisdk.org/reports/K230/Debian/README/
  - https://matrix.ruyisdk.org/reports/Mars/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo256m/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo_S/Debian/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Debian/README/
  - https://matrix.ruyisdk.org/
- id: ubuntu
  name: Ubuntu
  vendor: ''
  upstream: official
  upstream_note: Canonical официально собирает и размещает образы riscv64 ("built and hosted by Canonical"), riscv64 — официально поддерживаемая архитектура Ubuntu; начиная с 26.04 LTS базовая версия ISA
    повышена до RVA23S64.
  kind: distro
  based_on: Debian
  audience: recommended
  versions:
  - 26.10 (текущая версия, RVA23)
  - 26.04.1 LTS (RVA23)
  - 24.04.5 LTS (RVA20, поддержка старого оборудования продолжается)
  boards:
  - board: qemu
    level: official
    note: 26.10 / 26.04.1 LTS предоставляют Desktop, Server live installer и preinstalled образы; на официальной странице есть инструкция по установке в QEMU
  - board: unmatched
    level: official
    note: 24.04.5 LTS предоставляет ubuntu-24.04.5-preinstalled-server-riscv64+unmatched.img.xz
  - board: visionfive2
    level: official
    note: Образ jh7110 (24.04.5 LTS +jh7110, охватывает VisionFive 2 / VisionFive 2 Lite)
  - board: licheepi-4a
    level: partial
    note: В официальном списке плат нет LicheePi 4A (только Sipeed LicheeRV Dock), требуется самостоятельная сборка/образы сообщества
  - board: meles
    level: partial
    note: В официальном списке плат нет Milk-V Meles
  - board: k3
    level: official
    note: Поддержка платформы SpacemiT K3 (CoM260, picoITX, DeepComputing FML13V05) с 26.10
  - board: a210
    level: partial
    note: В официальном списке плат нет Zhihe A210
  - board: k230
    level: partial
    note: В официальном списке плат нет Canaan K230
  - board: megrez
    level: partial
    note: В официальном списке плат нет Milk-V Megrez
  - board: titan
    level: partial
    note: В официальном списке плат нет Milk-V Titan
  - board: pioneer
    level: partial
    note: В официальном списке плат нет Milk-V Pioneer
  - board: orangepi-rv2
    level: partial
    note: В официальном списке плат только Milk-V Mars (тот же K1), нет Orange Pi RV2
  - board: bpi-f3
    level: partial
    note: В официальном списке плат нет Banana Pi BPI-F3
  downloads:
  - label: Официальная страница загрузки RISC-V от Canonical (выбор образа по плате)
    url: https://ubuntu.com/download/risc-v/canonical-built
  - label: Каталог cdimage 26.10 riscv64
    url: https://cdimage.ubuntu.com/releases/26.10/release/
  - label: Каталог cdimage 26.04.1 LTS riscv64
    url: https://cdimage.ubuntu.com/releases/26.04/release/
  guides:
  - label: Страница загрузки RISC-V содержит инструкции по установке для каждой платы (installation instructions)
    url: https://ubuntu.com/download/risc-v/canonical-built
    type: doc
    lang: en
  - label: Анонс образов Ubuntu desktop для RISC-V (2026-10)
    url: https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
    type: doc
    lang: en
  gotchas:
  - 'Начиная с 26.04 LTS требуется RVA23S64: оборудование без RVA23 (VisionFive 2/JH7110, SiFive Unmatched и др.) может использовать только 24.04.5 LTS, официальная формулировка "Hardware that is not RVA23-ready
    continues to be supported by our 24.04.5 LTS release"'
  - Образы некоторых плат поддерживают только headless (без GPU, без WiFi), официальная страница прямо указывает это в записи DeepComputing FML13V01
  - Образы для конкретных плат различаются по суффиксу +<board> (+unmatched/+jh7110/+icicle/+nezha/+licheerv/+pic64gx), при скачивании неверного образа система не загрузится
  doc_langs:
  - en
  derivatives:
  - Ubuntu Base (riscv64 rootfs)
  - DeepComputing FML13V01 partner-built Ubuntu
  note: 'Ubuntu — дистрибутив с самой детальной поддержкой на уровне платы: официально выпускает preinstalled образы для каждой платы, но с 26.04 поднимает планку до RVA23, и старые платы остаются на 24.04
    LTS.'
  checked: '2026-11-01'
  order: 2
  feature: true
  sources:
  - https://ubuntu.com/download/risc-v/canonical-built
  - https://cdimage.ubuntu.com/releases/26.10/release/
  - https://cdimage.ubuntu.com/releases/26.04/release/
  - https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
  - https://matrix.ruyisdk.org/reports/K230/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Mars/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo/Ubuntu/README/
