- id: revyos
  name: RevyOS
  vendor: ''
  upstream: downstream
  upstream_note: 'Дистрибутив с downstream-кастомизацией: поддерживается PLCT Lab (Институт программного обеспечения КАН) для экосистемы XuanTie/T-Head, использует репозиторий пакетов Debian 13 (trixie)
    + кастомное ядро XuanTie; это не официальный port Debian и не независимая система пакетов.'
  kind: distro
  based_on: rootfs Debian 13 (trixie) + кастомное ядро 6.6 XuanTie (BSP TH1520/SG2042); старая версия 20240720 — Debian 12 + ядро 5.10
  audience: recommended
  versions:
