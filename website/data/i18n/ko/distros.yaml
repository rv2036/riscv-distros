# ko distro entries
items:
- id: debian
  name: Debian
  vendor: ''
  upstream: official
  upstream_note: Debian 13(trixie)부터 riscv64가 공식 릴리스 아키텍처입니다. 공식 보도자료 원문은 “This release for the first time officially supports the riscv64 architecture”. 메인 아카이브인 deb.debian.org에 들어가며 ports 추가 트리가 아닙니다(debian.org/ports
    목록에서 riscv64는 13/released로 표기).
  kind: distro
  based_on: 독립
  audience: recommended
  versions:
  - 13.7(trixie, 현재 안정판, ISO는 debian-13.7.0-riscv64-netinst.iso)
  - 14(forky, 개발/테스트 중)
  boards:
  - board: qemu
    level: official
    note: 공식 riscv64 netinst 이미지로 QEMU virt에 설치할 수 있고, d-i의 주요 대상 플랫폼입니다.
  - board: unmatched
    level: community
    note: 범용 riscv64 이미지 + 보드 측 U-Boot/UEFI 부팅. Debian은 보드 전용 이미지를 배포하지 않습니다.
  - board: visionfive2
    level: community
    note: 위와 같습니다. JH7110 보드는 벤더 U-Boot로 UEFI를 올린 뒤 범용 이미지를 설치합니다.
  - board: licheepi-4a
    level: partial
    note: TH1520은 벤더 U-Boot/커널이 필요하고, Debian 메인라인에는 보드 지원이 없습니다.
  - board: meles
    level: partial
    note: 같은 TH1520 플랫폼이라 상황은 LicheePi 4A와 비슷합니다.
  - board: k3
    level: partial
    note: SpacemiT K3는 벤더 BSP가 필요하며, Debian 메인라인 지원 여부는 확인되지 않았습니다.
  - board: a210
    level: partial
    note: 즈허(Zhihe) A210은 벤더 펌웨어/커널이 필요하고 Debian 공식 지원은 없습니다.
  - board: k230
    level: partial
    note: Canaan K230은 MCU 계열 SoC라 메인라인 지원이 제한적입니다.
  - board: megrez
    level: community
    note: EIC7700 보드는 범용 UEFI 이미지로 갈 수 있으나 Debian 문서에서 확인되지는 않았습니다.
  - board: titan
    level: community
    note: DP1000도 같습니다. Debian 문서에서 확인되지 않았습니다.
  - board: pioneer
    level: community
    note: SG2042는 범용 이미지로 갈 수 있으나 Debian 문서에서 확인되지 않았습니다.
  - board: orangepi-rv2
    level: community
    note: SpacemiT K1 보드. 범용 이미지 + 보드 측 U-Boot.
  - board: bpi-f3
    level: community
    note: SpacemiT K1 보드. 범용 이미지 + 보드 측 U-Boot.
  downloads:
  - label: riscv64 CD 이미지 디렉터리 (cdimage, 현재 안정판)
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - label: debian-13.7.0-riscv64-netinst.iso 직링크
    url: https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  guides:
  - label: Debian GNU/Linux 13 riscv64 설치 매뉴얼 (영문)
    url: https://www.debian.org/releases/stable/riscv64/
    type: doc
    lang: en
  - label: 설치 매뉴얼 중국어 간체
    url: https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
    type: doc
    lang: zh
  - label: 설치 매뉴얼 일본어
    url: https://www.debian.org/releases/stable/riscv64/index.ja.html
    type: doc
    lang: ja
  - label: 설치 매뉴얼 한국어
    url: https://www.debian.org/releases/stable/riscv64/index.ko.html
    type: doc
    lang: ko
  - label: 설치 매뉴얼 러시아어
    url: https://www.debian.org/releases/stable/riscv64/index.ru.html
    type: doc
    lang: ru
  - label: 'RISC-V Linux in 2026: Debian, RVA23, Servers, Hardware—and What''s Still Missing'
    url: https://www.youtube.com/watch?v=C5NkSlf4_WE
    type: video
    lang: en
  gotchas:
  - 범용 riscv64 이미지(netinst/ISO)만 배포하고 보드 전용 이미지는 없습니다. 부팅 가능 여부는 보드 측 U-Boot/UEFI 펌웨어에 달려 있습니다.
  - 공식 설치 매뉴얼도 “This installation guide has not been fully updated and fact checked for riscv64”라고 밝히고 있어 일부 장은 오래되었을 수 있습니다.
  - netinst 설치에는 네트워크로 패키지를 받아야 합니다.
  doc_langs:
  - en
  - zh
  - ja
  - ko
  - ru
  - fr
  - de
  derivatives:
  - Ubuntu
  note: Debian은 이 중 유일하게 riscv64를 정식 릴리스 아키텍처에 넣은 독립 배포판입니다. 파생으로는 Deepin, RevyOS 등 Debian 기반 riscv64 시스템이 있습니다(항목별 검증은 하지 않음).
  checked: '2026-11-01'
  order: 1
  feature: true
  sources:
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/
  - https://cdimage.debian.org/cdimage/release/current/riscv64/iso-cd/debian-13.7.0-riscv64-netinst.iso
  - https://www.debian.org/releases/stable/riscv64/
  - https://www.debian.org/releases/stable/riscv64/index.zh-cn.html
  - https://www.debian.org/releases/stable/riscv64/index.ja.html
  - https://www.debian.org/releases/stable/riscv64/index.ko.html
  - https://www.debian.org/releases/stable/riscv64/index.ru.html
  - https://www.youtube.com/watch?v=C5NkSlf4_WE
  - https://matrix.ruyisdk.org/reports/K230/Debian/README/
  - https://matrix.ruyisdk.org/reports/Mars/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo256m/Debian/README/
  - https://matrix.ruyisdk.org/reports/Duo_S/Debian/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Debian/README/
  - https://matrix.ruyisdk.org/
- id: ubuntu
  name: Ubuntu
  vendor: ''
  upstream: official
  upstream_note: Canonical이 riscv64 이미지를 직접 빌드·호스팅하며(“built and hosted by Canonical”) riscv64는 Ubuntu 공식 지원 아키텍처입니다. 26.04 LTS부터 ISA 베이스라인이 RVA23S64로 올라갑니다.
  kind: distro
  based_on: Debian
  audience: recommended
  versions:
  - 26.10(현재 버전, RVA23)
  - 26.04.1 LTS (RVA23)
  - 24.04.5 LTS(RVA20, 구형 하드웨어 계속 지원)
  boards:
  - board: qemu
    level: official
    note: 26.10 / 26.04.1 LTS는 Desktop·Server 라이브 설치본과 preinstalled 이미지를 제공하며, 공식 페이지에 QEMU 설치 안내가 있습니다.
  - board: unmatched
    level: official
    note: 24.04.5 LTS에 ubuntu-24.04.5-preinstalled-server-riscv64+unmatched.img.xz를 제공합니다.
  - board: visionfive2
    level: official
    note: jh7110 이미지(24.04.5 LTS +jh7110, VisionFive 2 / VisionFive 2 Lite 지원).
  - board: licheepi-4a
    level: partial
    note: 공식 보드 목록에 LicheePi 4A가 없습니다(Sipeed LicheeRV Dock만 있음). 직접 빌드하거나 커뮤니티 이미지를 써야 합니다.
  - board: meles
    level: partial
    note: 공식 보드 목록에 Milk-V Meles가 없습니다.
  - board: k3
    level: official
    note: SpacemiT K3 플랫폼(CoM260, picoITX, DeepComputing FML13V05)은 26.10부터 지원합니다.
  - board: a210
    level: partial
    note: 공식 보드 목록에 즈허 A210이 없습니다.
  - board: k230
    level: partial
    note: 공식 보드 목록에 Canaan K230이 없습니다.
  - board: megrez
    level: partial
    note: 공식 보드 목록에 Milk-V Megrez가 없습니다.
  - board: titan
    level: partial
    note: 공식 보드 목록에 Milk-V Titan이 없습니다.
  - board: pioneer
    level: partial
    note: 공식 보드 목록에 Milk-V Pioneer가 없습니다.
  - board: orangepi-rv2
    level: partial
    note: 공식 보드 목록에는 같은 K1인 Milk-V Mars만 있고 Orange Pi RV2는 없습니다.
  - board: bpi-f3
    level: partial
    note: 공식 보드 목록에 Banana Pi BPI-F3가 없습니다.
  - board: jupiter2
    level: partial
    note: ''
  downloads:
  - label: Canonical 공식 RISC-V 다운로드 페이지 (보드별 이미지 선택)
    url: https://ubuntu.com/download/risc-v/canonical-built
  - label: cdimage 26.10 riscv64 디렉터리
    url: https://cdimage.ubuntu.com/releases/26.10/release/
  - label: cdimage 26.04.1 LTS riscv64 디렉터리
    url: https://cdimage.ubuntu.com/releases/26.04/release/
  guides:
  - label: RISC-V 다운로드 페이지에 보드별 설치 안내(installation instructions) 포함
    url: https://ubuntu.com/download/risc-v/canonical-built
    type: doc
    lang: en
  - label: Announcing Ubuntu desktop images for RISC-V (2026-10)
    url: https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
    type: doc
    lang: en
  gotchas:
  - '26.04 LTS부터 RVA23S64가 필요합니다. RVA23이 아닌 하드웨어(VisionFive 2/JH7110, SiFive Unmatched 등)는 24.04.5 LTS만 쓸 수 있습니다. 공식 원문: “Hardware that is not RVA23-ready continues to be supported by our 24.04.5 LTS release”'
  - 일부 보드 이미지는 headless만 지원합니다(GPU·WiFi 없음). 공식 페이지의 DeepComputing FML13V01 항목에 이 점이 명시돼 있습니다.
  - 보드별 이미지는 +<board> 접미사로 구분합니다(+unmatched/+jh7110/+icicle/+nezha/+licheerv/+pic64gx). 잘못된 이미지를 받으면 부팅되지 않습니다.
  doc_langs:
  - en
  derivatives:
  - Ubuntu Base (riscv64 rootfs)
  - DeepComputing FML13V01 partner-built Ubuntu
  note: Ubuntu는 보드 지원이 가장 세밀한 편입니다. 보드별 preinstalled 이미지를 공식으로 배포하지만, 26.04부터 문턱이 RVA23으로 올라가 구형 보드는 24.04 LTS에 묶입니다.
  checked: '2026-11-01'
  order: 2
  feature: true
  sources:
  - https://ubuntu.com/download/risc-v/canonical-built
  - https://cdimage.ubuntu.com/releases/26.10/release/
  - https://cdimage.ubuntu.com/releases/26.04/release/
  - https://discourse.ubuntu.com/t/announcing-ubuntu-desktop-images-for-risc-v/89110
  - https://matrix.ruyisdk.org/reports/K230/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Mars/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo256m/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/Duo_S/Ubuntu/README/
  - https://matrix.ruyisdk.org/reports/OrangePi-RV2/Ubuntu/README_LTS/
  - https://matrix.ruyisdk.org/
- id: fedora
  name: Fedora
  vendor: ''
  upstream: community
  upstream_note: 'Fedora 공식 wiki 원문: “riscv64 is currently not an officially supported Fedora architecture”. 이미지는 Fedora RISC-V SIG가 관리하며 dl.fedoraproject.org/pub/alt/risc-v/(alt 트리, 메인 아키텍처 아님)에 있고 릴리스
    블로킹에는 참여하지 않습니다.'
  kind: distro
  based_on: 독립
  audience: recommended
  versions:
  - 44(안정판, RISC-V 이미지 제공 중)
  - 45(2026-11-03 출시. riscv64 이미지는 alt 트리, Server / Cloud / Container 모두 2026-10-22 빌드)
  - rawhide
  boards:
  - board: qemu
    level: official
    note: 공식 지원. mainline 커널로 충분합니다(Hardware 페이지 QEMU 항목).
  - board: unmatched
    level: partial
    note: Hardware 페이지에 SiFive Unmatched가 없습니다(Premier P550만 있음).
  - board: visionfive2
    level: official
    note: StarFive JH7110 항목이 공식 지원입니다. NVMe/PCIe가 필요 없으면 mainline 커널을 쓸 수 있습니다.
  - board: licheepi-4a
    level: partial
    note: Hardware 페이지에 LicheePi 4A / TH1520이 없습니다.
  - board: meles
    level: partial
    note: Hardware 페이지에 Milk-V Meles가 없습니다.
  - board: k3
    level: official
    note: 'SpacemiT K3 항목: K3 Pico-ITX, Milk-V Jupiter 2, K3-CoM260, DC-ROMA III (FML13V05).'
  - board: a210
    level: partial
    note: Hardware 페이지에 즈허 A210이 없습니다.
  - board: k230
    level: partial
    note: Hardware 페이지에 Canaan K230이 없습니다.
  - board: megrez
    level: official
    note: ESWIN EIC7700X 항목이 공식 지원입니다(Milk-V Megrez, HiFive Premier P550).
  - board: titan
    level: official
    note: UltraRISC UR-DP1000 항목이 공식 지원입니다(Milk-V Titan).
  - board: pioneer
    level: official
    note: SOPHGO SG2042 항목이 공식 지원입니다(Milk-V Pioneer).
  - board: orangepi-rv2
    level: official
    note: SpacemiT M1/K1 항목이 공식 지원입니다(Orange Pi RV 2, BPI-F3, Milk-V Jupiter 포함).
  - board: bpi-f3
    level: official
    note: SpacemiT M1/K1 항목이 공식 지원입니다(Banana Pi BPI-F3).
  - board: jupiter2
    level: official
    note: ''
  downloads:
  - label: Fedora RISC-V 이미지 전체 디렉터리 (alt/risc-v/releases)
    url: https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - label: Fedora 45 RISC-V 이미지 디렉터리(Server / Cloud / Container)
    url: https://dl.fedoraproject.org/pub/alt/risc-v/release/45/
  - label: Fedora Remix for RISC-V
    url: https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  guides:
  - label: Fedora RISC-V 설치 가이드 (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Fedora RISC-V 지원 하드웨어 목록 (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
    type: doc
    lang: en
  - label: Fedora/RISC-V 프로젝트 홈페이지 (wiki)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V
    type: doc
    lang: en
  gotchas:
  - '대부분의 보드는 Omni 커널(...riscv64.omni.fcXX)이 필요합니다. 표준 7.x 커널은 VisionFive 2 / Orange Pi RV / Milk-V Mars 정도만 커버합니다. 공식 원문: “Most boards can only boot when using the Omni kernel”'
  - Omni 커널에는 아직 업스트림되지 않은 patch가 남아 있습니다(원문 “Some patches in this kernel are still under review upstream”).
  - headless 전용입니다. mainline에 SoC 내장 GPU 드라이버가 없고 공식 포지셔닝도 빌드 머신/서버입니다(“video output are pretty much completely ignored”).
  - 설치에는 시리얼 콘솔이 필요합니다(Requirements → Serial console access).
  - 일부 패키지는 RISC-V 전용 patch가 필요해 업스트림 소스와 차이가 남아 있습니다.
  doc_langs:
  - en
  derivatives:
  - Fedora-V Force (FVF)
  - Fedora Remix for RISC-V
  note: Fedora에는 공식 RISC-V SIG와 지속 빌드가 있지만 riscv64는 여전히 "not officially supported"로 표기되고 이미지는 alt 채널로 배포됩니다. 일상 사용에는 문제가 없지만 공식 지원 등급은 Debian이나 Ubuntu와 같지 않습니다.
  checked: '2026-11-04'
  order: 3
  feature: true
  sources:
  - https://dl.fedoraproject.org/pub/alt/risc-v/releases/
  - https://dl.fedoraproject.org/pub/alt/risc-v/fedora-remix/
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Hardware
  - https://fedoraproject.org/wiki/Architectures/RISC-V
  - https://matrix.ruyisdk.org/reports/Bit-Brick_K1/Fedora/README/
  - https://matrix.ruyisdk.org/reports/BPI-F3/Fedora/README/
  - https://matrix.ruyisdk.org/reports/K230/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheeCluster4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/LicheePi4A/Fedora/README/
  - https://matrix.ruyisdk.org/reports/Mars/Fedora/README/
  - https://matrix.ruyisdk.org/
