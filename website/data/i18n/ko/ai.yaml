    note: Sipeed 공식 wiki에 llama.cpp 장이 있습니다. 7B 모델에서 약 6s/token(V 확장 미사용). C910은 RVV 0.7.1이라 업스트림 RVV 1.0 최적화 경로를 쓸 수 없어 스칼라로만 돕니다.
