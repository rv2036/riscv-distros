# AI 소프트웨어 항목(한국어판, 구조는 zh와 동일)
ruyisdk:
  url: https://matrix.ruyisdk.org/
  fetched_at: '2026-11-01'
  note: RuyiSDK 공식 “RISC-V Board and OS Support Matrix”. 프런트엔드는 Astro 정적 사이트이고 /table/ 페이지 본문은 JS로 렌더링되며, 데이터는 GitHub 저장소 ruyisdk/support-matrix(보드/배포판 디렉터리마다 README.md 하나, YAML frontmatter가 데이터 원천)에서 직접 옵니다. 이번에는 git sparse clone으로 md 파일 951개를 모두 받아 파싱했고 사이트 데이터와 동등합니다. 매트릭스 입도는 “부팅 가능/데스크톱 진입 가능” 지원 등급이고 패키지별 사용 가능 여부는 담지 않습니다. “RuyiSDK로 바로 기록 가능”은 ruyi_provisioning을 보세요.
items:
- board: qemu
  board_name: QEMU virt 가상 머신
  soc: QEMU 에뮬레이션 rv64(vlen=256, RVV 1.0)
  runs:
  - item: llama.cpp
    state: works
    evidence:
    - https://github.com/kriznaw/llama.cpp-riscv64-qemu
    - https://raw.githubusercontent.com/ggml-org/llama.cpp/master/docs/build-riscv64-spacemit.md
    note: qemu-riscv64 -cpu max,vlen=256로 업스트림 빌드를 실행할 수 있고 SpacemiT 문서에 qemu에서 llama-cli를 돌리는 전체 명령이 있습니다. 기능 검증용일 뿐 속도는 의미가 없습니다.
  - item: onnxruntime
    state: partial
    evidence:
    - https://raw.githubusercontent.com/microsoft/onnxruntime/main/tools/scripts/build_riscv64.sh
    note: build_riscv64.sh가 qemu로 크로스 컴파일 산출물을 검증하는 구조입니다. 돌긴 하지만 매우 느립니다.
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: RISE 휠이 “QEMU 빌드 아님”이라고 명시하고 있어 qemu에서는 기능 검증만 가능합니다.
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: 에뮬레이션 환경에서 동작하며 성능 의미는 없습니다.
  - item: ncnn
    state: works
    evidence:
    - https://github.com/Tencent/ncnn/actions/workflows/linux-riscv64.yml
    note: CI가 riscv64에서 통과합니다.
  npu: 없음(순수 에뮬레이션)
  note: 하드웨어가 없을 때 컴파일과 기능을 검증하는 용도이고 성능 근거로 쓸 수 없습니다.
  checked: '2026-11-01'
  order: 1
