    note: 업스트림 riscv64 빌드의 MLAS RVV kernel은 RVV 1.0 대상이라 TH1520의 0.7.1 벡터를 바로 쓸 수 없어 스칼라로 되돌아갑니다.
  - item: pytorch
    state: partial
    evidence:
    - https://riseproject.dev/2026/08/18/pytorch-is-available-on-riscv64/
    note: RISE 휠은 glibc ≥ 2.39에 RVV 1.0 최적화 경로입니다. RevyOS/Debian에서 설치되지만 벡터 가속은 없습니다.
  - item: opencv
    state: works
    evidence:
    - https://github.com/opencv/opencv/wiki/OpenCV-RISC-V
    note: 일반적으로 사용 가능합니다. RVV HAL은 0.7.1 지원이 제한적입니다.
  - item: ncnn
    state: partial
    evidence:
    - https://github.com/Tencent/ncnn
    note: 컴파일은 되지만 RVV 최적화는 1.0 대상이라 0.7.1에서는 스칼라로 퇴화합니다.
  - item: tengine
    state: partial
    evidence:
    - https://github.com/OAID/Tengine/tree/tengine-lite/source/device/cpu/op/conv/risc-v
    note: tengine-lite에 rv64-c906 툴체인과 RVV 컨볼루션 kernel이 있어 C906/C910 같은 0.7.1 코어를 겨냥하지만 일부 연산자만 커버합니다.
  - item: npu-sdk (HHB)
    state: partial
    evidence:
    - https://raw.githubusercontent.com/sipeed/sipeed_wiki/main/docs/hardware/en/lichee/th1520/lpi4a/8_application.md
    note: 공식 wiki의 NPU 절차는 T-Head HHB 컴파일러로 ONNX를 NPU 실행 파일(int8/int16 고정소수점)로 바꾸는 것이고 전용 docker 이미지가 필요합니다. 클로즈드 툴체인이고 고정소수점만 지원해 LLM에는 맞지 않습니다.
  npu: 4 TOPS@INT8, 벤더 클로즈드 HHB 툴체인(int8/int16 고정소수점)뿐이고 업스트림 오픈소스 드라이버가 없습니다
  note: CPU로 LLM을 돌릴 수는 있지만 느립니다(약 6s/token). NPU는 T-Head 클로즈드 HHB 경로뿐이라 Transformer LLM은 못 돌립니다.
