    note: 사용할 수 있지만 최적화가 0.7.1 C906 대상이라 1.0에서는 이득이 제한적입니다.
  - item: spacemit-ai-sdk
    state: works
    evidence:
    - https://archive.spacemit.com/spacemit-ai/
    note: archive.spacemit.com/spacemit-ai/가 ModelZoo, llama.cpp, localai, dify 같은 산출물을 제공하며 현재 RISC-V에서 가장 완성도 높은 벤더 AI 스택 중 하나입니다.
  npu: K3는 CPU+AI 코어(SpacemiT IME 확장)가 주력이고 독립 범용 NPU 프로그래밍 모델이 없습니다. 가속은 SpacemiT 사설 명령과 AI SDK로 합니다
  note: 현재 RISC-V SBC 중 AI 소프트웨어 스택이 가장 완성도 높은 축이고, 업스트림 llama.cpp가 그 kernel을 직접 내장하고 있습니다.
