- id: licheepi-4a
  name: LicheePi 4A(리치파이 4A)
  soc: 'T-Head TH1520: 4×C910 @1.85GHz + C906 + E902, 4TOPS NPU'
  vendor: Sipeed
  spec: 4/8/16GB LPDDR4X, 8/32/128GB eMMC, 기가비트 이더넷 2개, WiFi5/BT5, HDMI 2.0 + 4레인 MIPI DSI, MIPI CSI 2개, USB3 4개, 40핀 GPIO.
  status: on_sale
  price_note: 8GB 약 US$120, 16GB 약 US$180(채널 견적, 미검증)
  forms: []
  official_os:
  - revyos
  distros:
  - distro: revyos
    level: official
    note: 공식 주력. 최신 시스템 이미지 20251226(Debian 계열 + kernel 6.6).
  - distro: debian
    level: partial
    note: 메인라인 Debian 13이 LPi4A에서 부팅되지만 U-Boot/DTB를 직접 준비해야 하고 공식 설치 이미지는 없습니다.
  - distro: ubuntu
    level: partial
    note: ubuntu-base rootfs뿐이라 커널과 부팅 구성을 직접 해야 합니다.
  - distro: fedora
    level: community
    note: Fedora-V Force가 TH1520 이미지를 제공합니다.
  - distro: arch
    level: community
    note: archriscv가 TH1520을 지원합니다.
  - distro: armbian
    level: community
    note: Armbian이 LicheePi 4A를 공식 지원합니다.
  - distro: gentoo
    level: community
    note: Gentoo wiki에 TH1520 전용 페이지가 있습니다.
  - distro: nixos
    level: community
    note: 커뮤니티 저장소 nixos-licheepi4a(RevyOS 커널/U-Boot 재사용).
  - distro: openeuler
    level: community
    note: openEuler RISC-V SIG가 이미지를 제공합니다.
  - distro: openkylin
    level: community
    note: 커뮤니티 openKylin 이미지.
  - distro: deepin
    level: community
    note: deepin RISC-V 포팅판.
  - distro: buildroot
    level: partial
    note: RevyOS가 Buildroot로 boot/rootfs를 빌드합니다.
  downloads:
  - label: RevyOS LicheePi 4A 이미지 (20251226)
    url: https://mirror.iscas.ac.cn/revyos/extra/images/lpi4a/20251226/
  - label: RevyOS 플래싱 개요 (U-Boot env 초기화 설명 포함)
    url: https://docs.revyos.dev/en/docs/Installation/intro/
  - label: Sipeed Wiki 이미지 모음 (영문)
    url: https://wiki.sipeed.com/hardware/en/lichee/th1520/lpi4a/3_images.html
  - label: Sipeed Wiki 이미지 모음 (중문, 정보가 가장 많음)
    url: https://wiki.sipeed.com/hardware/zh/lichee/th1520/lpi4a/3_images.html
  - label: Sipeed 공식 다운로드 서버 (사양/회로도/도구)
