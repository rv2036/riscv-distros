  - https://github.com/starfive-tech/VisionFive2
  - https://wiki.debian.org/InstallingDebianOn/StarFive/VisionFiveV2
  - https://www.armbian.com/visionfive2/
  - https://archriscv.felixc.at/images/
  - https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - https://forum.rvspace.org/t/visionfive-2-lite-debian-202510-released/5714
  - https://wiki.gentoo.org/wiki/StarFive_VisionFive_2
  - https://matrix.ruyisdk.org/reports/VisionFive2/Alpine/README/
  - https://matrix.ruyisdk.org/reports/VisionFive2/ArchLinux/README/
  - https://matrix.ruyisdk.org/reports/VisionFive2/Armbian/README/
