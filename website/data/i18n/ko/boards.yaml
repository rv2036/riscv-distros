  - label: Gentoo TH1520 배포 가이드
    url: https://wiki.gentoo.org/wiki/User:Dlan/RISC-V/TH1520
  - label: deepin RISC-V 이미지
    url: https://deepin-community.github.io/sig-deepin-ports/images/riscv64
  - label: openKylin LPi4A 이미지 (커뮤니티)
    url: https://github.com/aiminickwong/licheepi4a-images
  guides:
  - label: Sipeed Wiki 보드 소개 (영문)
    url: https://wiki.sipeed.com/hardware/en/lichee/th1520/lpi4a/1_intro.html
    type: doc
    lang: en
  - label: Sipeed Wiki 보드 소개 (중문)
    url: https://wiki.sipeed.com/hardware/zh/lichee/th1520/lpi4a/1_intro.html
    type: doc
    lang: zh
  - label: RevyOS 문서 사이트
    url: https://docs.revyos.dev/
    type: doc
    lang: en
  - label: RuyiSDK 지원 매트릭스 (배포판별 실측 상태)
    url: https://matrix.ruyisdk.org/
    type: doc
    lang: zh
  gotchas:
  - GPU는 Imagination BXM-4-64인데 벤더 클로즈드 blob뿐이라 메인라인 커널에서는 GPU 가속이 없습니다. NPU는 T-Head 전용 SDK가 필요합니다.
  - 2023.8.1 이전 출하 16GB 배치에 U-Boot 메모리 인식 버그가 있어 16G 전용 u-boot를 기록해야 합니다. 아니면 대용량 메모리 앱이 죽습니다.
  - 플래싱은 BOOT 키를 누른 채 전원을 넣어 fastboot(USB 2345:7654)로 들어가야 합니다. 일반 전원 투입으로는 다운로드 모드에 못 들어갑니다.
  - 20240720 이하 RevyOS에서 올라올 때는 반드시 env default -a -f; env save로 U-Boot 환경 변수를 초기화해야 합니다.
  - 8GB와 16GB 버전은 boot.ext4 디바이스 트리가 달라 섞어 기록하면 부팅되지 않습니다.
  - 2026-09부터 RevyOS가 coreboot+EDK2 새 펌웨어(U-Boot SPL 대체)를 밀고 있는데 실험 성격이라 기록 전에 보드 형식을 확인하세요.
