# ko board entries
items:
- id: qemu
  name: QEMU virt 가상 머신
  soc: 없음(QEMU 범용 가상 플랫폼, RV32/RV64 구성 가능, 최대 512코어)
  vendor: QEMU Project
  spec: '순수 가상 플랫폼: 최대 512개 RV64GC 코어, CLINT/PLIC, PCIe 호스트 브리지, virtio-mmio 8개, NS16550 UART, 선택적 AIA/IOMMU. 메모리·디스크·네트워크는 전부 명령행 인자로 가상화되고 실제 GPU/VPU/NPU는 없습니다.'
  status: virtual
  price_note: 무료 오픈소스(GPLv2), 각 배포판 소프트웨어 저장소로 제공
  forms: []
  official_os:
  - debian
  - ubuntu
  distros:
  - distro: debian
    level: official
    note: Debian 13부터 riscv64가 정식 아키텍처라 공식 netinst ISO를 virt에 바로 설치할 수 있습니다.
  - distro: ubuntu
    level: official
    note: 공식 riscv64 cloud image. EDK2(pflash) 또는 -kernel로 부팅합니다.
  - distro: fedora
    level: community
    note: Fedora RISC-V가 QEMU 설치 안내와 이미지를 제공합니다.
  - distro: alpine
    level: official
    note: riscv64 minirootfs만 있고 virt ISO가 없어 커널/initramfs를 직접 준비해야 합니다.
  - distro: arch
    level: official
    note: archriscv가 riscv64 ISO를 제공하며 QEMU에서 부팅할 수 있습니다.
  - distro: opensuse
    level: community
    note: openSUSE Ports가 riscv64를 제공하지만 공식 사이트가 curl에 403을 돌려줘 직링크는 검증하지 못했습니다.
  - distro: gentoo
    level: official
    note: stage3 riscv64 + 핸드북이 QEMU 시스템을 지원합니다.
  - distro: void
    level: partial
    note: riscv64 포트는 있지만 QEMU 이미지는 직접 빌드해야 합니다.
  - distro: nixos
    level: community
    note: riscv64는 비공식 지원 등급이라 크로스 빌드가 필요합니다.
  - distro: alt
    level: official
    note: ALT Ports riscv64가 QEMU 이미지를 제공합니다.
  - distro: freebsd
    level: official
    note: riscv64가 QEMU virt를 지원합니다.
  - distro: netbsd
    level: official
    note: riscv64 포트가 QEMU를 지원합니다.
  - distro: openbsd
    level: official
    note: riscv64가 QEMU virt를 지원합니다.
  - distro: openeuler
    level: official
    note: openEuler RISC-V SIG가 QEMU 이미지를 제공합니다.
  - distro: buildroot
    level: official
    note: qemu_riscv64_virt_defconfig, make 한 줄로 시스템이 뜹니다.
  - distro: yocto
    level: official
    note: qemuriscv64 machine 공식 지원.
  downloads:
  - label: 'QEMU 공식 문서: RISC-V virt 머신'
    url: https://www.qemu.org/docs/master/system/riscv/virt.html
  - label: QEMU 다운로드 페이지
    url: https://www.qemu.org/download/
  - label: Ubuntu 24.04 riscv64 cloud image
    url: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-riscv64.img
  - label: Debian 13.7 riscv64 netinst ISO
    url: https://cdimage.debian.org/debian-cd/current/riscv64/iso-cd/
  - label: Arch Linux RISC-V ISO
    url: https://archriscv.felixc.at/images/archlinux-2026.08.27-riscv64.iso
  - label: Alpine riscv64 minirootfs
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - label: Buildroot 다운로드
    url: https://buildroot.org/downloads/
  guides:
  - label: 'QEMU wiki: RISC-V 플랫폼 설명'
    url: https://wiki.qemu.org/Documentation/Platforms/RISCV
    type: doc
    lang: en
  - label: 'Debian wiki: RISC-V 포트'
    url: https://wiki.debian.org/RISC-V
    type: doc
    lang: en
  - label: 'Fedora: RISC-V 설치 가이드'
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  - label: Gentoo RISC-V 프로젝트
    url: https://wiki.gentoo.org/wiki/Project:RISC-V
    type: doc
    lang: en
  - label: openEuler RISC-V SIG
    url: https://www.openeuler.org/en/sig/sig-RISC-V
    type: doc
    lang: en
  gotchas:
  - -bios default는 OpenSBI만 올리고 U-Boot/EDK2는 없습니다. Ubuntu/Fedora cloud image를 부팅하려면 pflash로 32MiB EDK2 펌웨어를 올려야 하고, 아니면 화면이 검게 나옵니다.
  - virt에는 GPU/VPU/NPU가 없으니 그래픽, 영상 하드웨어 디코딩, AI 가속 검증에 쓰면 안 됩니다.
  - 시리얼은 ttyS0으로 고정입니다. -nographic 모드에서 나가려면 Ctrl-A 다음 X를 누릅니다.
  - Ubuntu 26.04부터 RVA23S64가 필요해 확장이 없는 구버전 QEMU에서는 부팅되지 않습니다. 24.04는 여전히 RVA20 베이스라인입니다.
  - Alpine riscv64는 minirootfs만 내고 virt ISO가 없어 커널과 initramfs를 직접 준비해야 합니다.
  doc_langs:
  - en
  note: 모든 보드의 공통 출발점입니다. virt에서 커널/rootfs를 먼저 검증하고 실기로 넘어가면 플래싱과 디버깅 시간을 크게 줄일 수 있습니다.
  checked: '2026-11-01'
  order: 1
  feature: true
  sources:
  - https://www.qemu.org/docs/master/system/riscv/virt.html
  - https://www.qemu.org/download/
  - https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-riscv64.img
  - https://cdimage.debian.org/debian-cd/current/riscv64/iso-cd/
  - https://archriscv.felixc.at/images/archlinux-2026.08.27-riscv64.iso
  - https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - https://buildroot.org/downloads/
  - https://wiki.qemu.org/Documentation/Platforms/RISCV
  - https://wiki.debian.org/RISC-V
  - https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
  - https://www.qemu.org/docs/master/system/riscv/virt.html
- id: visionfive2
  name: StarFive VisionFive 2
  soc: 'StarFive JH7110: 4×SiFive U74 @1.5GHz + S7 모니터 코어 + E24'
  vendor: StarFive
  spec: 2/4/8GB LPDDR4, microSD + eMMC(일부 버전), M.2 M-Key NVMe, 기가비트 이더넷 2개(v1.3은 PoE 지원), HDMI 2.0, USB 4개, 40핀 GPIO. 간소화 버전인 VisionFive 2 Lite도 있습니다.
  status: on_sale
  price_note: 표준판 2/4/8GB 약 US$60–120(미검증). VisionFive 2 Lite 채널 실판매가 US$99.95
  forms: []
  official_os:
  - debian
  - ubuntu
  distros:
  - distro: debian
    level: official
    note: StarFive 공식 Debian 202510(Trixie + Wayland 데스크톱)이며, 메인라인 Debian 13 공식 설치 프로그램으로도 설치할 수 있습니다.
  - distro: ubuntu
    level: official
    note: StarFive 공식 Ubuntu 24.04.3(202510) + Canonical jh7110 프리인스톨 이미지.
  - distro: fedora
    level: community
    note: Fedora RISC-V 공식 테스트 보드 중 하나입니다.
  - distro: opensuse
    level: community
    note: openSUSE Ports가 riscv64를 제공하지만 공식 사이트가 403이라 직링크는 미검증입니다.
  - distro: arch
    level: community
    note: archriscv가 VF2 rootfs/ISO를 제공합니다.
  - distro: alpine
    level: community
    note: riscv64 minirootfs를 쓸 수 있습니다.
  - distro: armbian
    level: community
    note: Armbian이 VisionFive 2를 공식 지원합니다.
  - distro: gentoo
    level: community
    note: Gentoo wiki에 VisionFive 2 전용 페이지가 있습니다.
  - distro: netbsd
    level: community
    note: NetBSD/riscv가 JH7110을 지원합니다.
  - distro: openbsd
    level: community
    note: OpenBSD/riscv64가 JH7110을 지원합니다.
  - distro: freebsd
    level: community
    note: FreeBSD에 JH7110 지원이 있습니다.
  - distro: nixos
    level: community
    note: 커뮤니티 유지보수로 이미지를 직접 만들어야 합니다.
  - distro: buildroot
    level: official
    note: StarFive SDK가 Buildroot 기반이라 SPL/U-Boot/FIT를 만듭니다.
  - distro: yocto
    level: community
    note: 커뮤니티 meta-starfive 레이어.
  - distro: openeuler
    level: community
    note: openEuler RISC-V SIG가 이미지를 제공합니다.
  - distro: deepin
    level: community
    note: deepin RISC-V 포팅판.
  - distro: openkylin
    level: community
    note: openKylin에 VF2 이미지가 있습니다.
  downloads:
  - label: StarFive 공식 Debian 202510 (v0.15.0)
    url: https://github.com/starfive-tech/Debian/releases/tag/v0.15.0-engineering-release-wayland
  - label: StarFive 공식 Ubuntu 24.04.3 (202510)
    url: https://github.com/starfive-tech/VisionFive2/releases/tag/6.0.0
  - label: Canonical Ubuntu jh7110 프리인스톨 이미지 (VF2/Mars/Star64 공용)
    url: https://cdimage.ubuntu.com/ubuntu/releases/24.04.5/release/ubuntu-24.04.5-preinstalled-server-riscv64+jh7110.img.xz
  - label: StarFive VisionFive2 SDK / 펌웨어
    url: https://github.com/starfive-tech/VisionFive2
  - label: 'Debian wiki: VisionFive 2에 Debian 설치'
    url: https://wiki.debian.org/InstallingDebianOn/StarFive/VisionFiveV2
  - label: Armbian VisionFive 2
    url: https://www.armbian.com/visionfive2/
  - label: Arch Linux RISC-V 이미지 디렉터리
    url: https://archriscv.felixc.at/images/
  - label: Alpine riscv64 minirootfs
    url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/riscv64/alpine-minirootfs-3.22.1-riscv64.tar.gz
  - label: 'RVspace 포럼: Debian 202510 릴리스 글 (호환성 피드백 포함)'
    url: https://forum.rvspace.org/t/visionfive-2-lite-debian-202510-released/5714
  guides:
  - label: StarFive VisionFive2 SDK 문서 (README, 펌웨어 기록/복구 포함)
    url: https://github.com/starfive-tech/VisionFive2
    type: doc
    lang: en
  - label: Debian wiki 설치 가이드
    url: https://wiki.debian.org/InstallingDebianOn/StarFive/VisionFiveV2
    type: doc
    lang: en
  - label: 'Gentoo wiki: StarFive VisionFive 2'
    url: https://wiki.gentoo.org/wiki/StarFive_VisionFive_2
    type: doc
    lang: en
  - label: RVspace 공식 커뮤니티 (중영문)
    url: https://rvspace.org/
    type: doc
    lang: zh
  - label: Fedora RISC-V 설치 가이드
    url: https://fedoraproject.org/wiki/Architectures/RISC-V/Installing
    type: doc
    lang: en
  gotchas:
  - U-Boot/SPL이 QSPI Flash에 있어 이미지와 펌웨어가 강하게 묶입니다. 202310 이후 이미지는 QSPI의 U-Boot ≥ v3.1.5를 요구하므로, 아니면 u-boot-spl.bin.normal.out + visionfive2_fw_payload.img를 먼저 기록해야 합니다.
  - 부팅 순서가 QSPI → SD/eMMC/NVMe라 DIP 스위치를 잘못 두면 엉뚱한 매체에서 부팅합니다.
  - v1.2 구형 보드에 Debian 202510을 올리면 실패 보고가 있습니다. 펌웨어를 먼저 올리거나 메인라인 Debian으로 바꾸세요.
  - StarFive 공식 Debian 202510은 USB 부팅을 지원하지 않습니다. 메인라인 Debian 13은 USB 부팅이 되지만 HDMI/GPU/VPU 드라이버가 없습니다.
  - VisionFive 2 Lite는 표준판과 U-Boot/DTB가 달라 이미지를 섞어 쓸 수 없습니다.
  - eMMC/SD 부팅에 알려진 errata가 있으니 NVMe나 품질 좋은 SD 카드를 우선하세요.
  doc_langs:
  - en
  - zh
  note: 생태계와 배포판 커버리지가 가장 넓은 JH7110 보드로, 초보자의 첫 RISC-V 보드 후보 중 하나입니다. 배치별 펌웨어 차이에 주의하세요. openwrt/dietpi/guix 등 커뮤니티 파생판도 있습니다(표준 배포판 id에는 미포함).
  checked: '2026-11-01'
  order: 2
  feature: true
