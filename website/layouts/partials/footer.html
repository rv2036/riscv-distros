<footer class="site-foot">
  <div class="wrap">
    <span>{{ site.Title }} · <a href="https://{{ site.Params.domain }}">{{ site.Params.domain }}</a></span>
    <span>{{ i18n "footer.license" }}</span>
    <span class="spacer"></span>
    <a href="{{ "start/" | relLangURL }}">{{ i18n "nav.start" }}</a>
    <a href="{{ "distros/" | relLangURL }}">{{ i18n "nav.distros" }}</a>
    <a href="{{ "matrix/" | relLangURL }}">{{ i18n "nav.matrix" }}</a>
    <a href="{{ site.Params.repo }}" rel="noopener">{{ i18n "footer.source" }}</a>
  </div>
</footer>
